<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>STAGE CLOCK</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #050505;
    color: #fff;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;
}

button {
    font: inherit;
    cursor: pointer;
}

/* =========================
   MAIN
========================= */

.main {
    width: 100%;
    height: 100dvh;

    display: grid;
    grid-template-columns: 58% 42%;
    align-items: center;

    padding: 5vh 6vw;
}

/* =========================
   CLOCK
========================= */

.clock-area {
    display: flex;
    flex-direction: column;
    justify-content: center;
}

.label {
    color: #666;
    font-size: clamp(9px, 1.2vw, 15px);
    letter-spacing: .45em;
    margin-bottom: 18px;
}

.clock {
    font-size: clamp(60px, 10vw, 160px);
    font-weight: 700;
    line-height: .95;
    letter-spacing: .02em;
    font-variant-numeric: tabular-nums;
}

.date {
    margin-top: 18px;
    color: #666;
    font-size: clamp(11px, 1.4vw, 18px);
    letter-spacing: .25em;
}

/* =========================
   CURRENT
========================= */

.next-area {
    padding-left: 3vw;
}

.current-label,
.next-title {
    color: #666;
    font-size: clamp(9px, 1.1vw, 14px);
    letter-spacing: .4em;
}

.current-name {
    margin-top: 10px;
    font-size: clamp(25px, 4vw, 60px);
    font-weight: 700;
}

.current-time {
    color: #777;
    margin-top: 6px;
    font-size: clamp(13px, 1.6vw, 21px);
}

.next-block {
    margin-top: 35px;
}

.next-name {
    margin-top: 10px;
    font-size: clamp(20px, 3vw, 45px);
    font-weight: 700;
}

.next-time {
    margin-top: 6px;
    color: #777;
    font-size: clamp(13px, 1.6vw, 21px);
}

.countdown {
    margin-top: 8px;
    font-size: clamp(28px, 4.5vw, 65px);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
}

/* =========================
   NEXT BUTTON
========================= */

.next-button {
    margin-top: 28px;

    width: min(320px, 90%);
    height: 70px;

    border: 1px solid #444;
    border-radius: 10px;

    background: #151515;
    color: #fff;

    font-size: 20px;
    font-weight: 700;
}

.next-button:active {
    transform: scale(.98);
    background: #252525;
}

.next-button:disabled {
    opacity: .3;
}

/* =========================
   TAB
========================= */

.timetable-tab {
    position: fixed;

    right: 0;
    top: 50%;

    transform: translateY(-50%);

    width: 52px;
    height: 104px;

    background: #111;
    color: #fff;

    border: 1px solid #333;
    border-right: none;

    border-radius: 52px 0 0 52px;

    z-index: 3000;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 28px;
}

#tabArrow {
    transition: transform .25s;
}

body.timetable-open #tabArrow {
    transform: rotate(180deg);
}

body.timetable-open .timetable-tab {
    right: min(460px, 90vw);
}

/* =========================
   SIDE
========================= */

.side {
    position: fixed;

    top: 0;
    right: 0;

    width: min(460px, 90vw);
    height: 100dvh;

    background: #070707;

    border-left: 1px solid #222;

    z-index: 2500;

    padding: 18px;

    display: flex;
    flex-direction: column;

    transform: translateX(100%);
    transition: transform .25s ease;
}

.side.open {
    transform: translateX(0);
}

/* =========================
   SIDE HEADER
========================= */

.side-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.side-header h2 {
    margin: 0;
    font-size: 14px;
    letter-spacing: .35em;
}

.small-button {
    background: #111;
    color: #aaa;

    border: 1px solid #333;
    border-radius: 5px;

    padding: 7px 10px;
}

/* =========================
   TIMETABLE
========================= */

.timeline {
    flex: 1;
    overflow-y: auto;

    margin-top: 14px;
    padding-bottom: 15px;
}

.event {
    position: relative;

    display: grid;
    grid-template-columns: 72px 1fr 30px;

    gap: 8px;

    align-items: start;

    border-left: 3px solid #333;

    padding: 11px 8px;

    margin-bottom: 5px;

    border-radius: 0 7px 7px 0;

    transition: .15s;
}

.event.current {
    background: #181818;
    border-left-color: #fff;
}

.event.completed {
    opacity: .4;
}

.event-time-original {
    font-size: 14px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
}

.event-name {
    font-size: 15px;
    font-weight: 600;
    line-height: 1.3;
}

/*
    実際の変更後時刻
*/

.actual-time {
    margin-top: 3px;

    font-size: 11px;
    font-weight: 700;

    font-variant-numeric: tabular-nums;
}

.actual-time.push {
    color: #ff4141;
}

.actual-time.pull {
    color: #48c85d;
}

/*
    ＋5min / −5min
*/

.shift-label {
    margin-top: 1px;

    font-size: 10px;
    font-weight: 700;
}

.shift-label.push {
    color: #ff4141;
}

.shift-label.pull {
    color: #48c85d;
}

.on-time {
    margin-top: 3px;

    font-size: 9px;
    color: #777;

    letter-spacing: .1em;
}

.event-badge {
    margin-top: 5px;

    font-size: 9px;
    color: #888;
}

.delete {
    background: transparent;
    border: none;
    color: #555;
    font-size: 20px;
}

/* =========================
   ADD
========================= */

.add-form {
    display: grid;

    grid-template-columns: 90px 1fr;

    gap: 6px;

    margin-top: 5px;
}

.add-form input {
    min-width: 0;

    background: #111;
    color: #fff;

    border: 1px solid #333;
    border-radius: 5px;

    padding: 9px;
}

.add-form button {
    grid-column: 1 / 3;

    padding: 10px;

    background: #111;
    color: #fff;

    border: 1px solid #333;
    border-radius: 5px;
}

/* =========================
   MANUAL
========================= */

.shift-section {
    border-top: 1px solid #222;

    margin-top: 10px;
    padding-top: 10px;
}

.shift-title {
    color: #666;

    font-size: 9px;

    letter-spacing: .3em;

    margin-bottom: 7px;
}

.shift-amount {
    display: grid;

    grid-template-columns: repeat(3, 1fr);

    gap: 5px;
}

.shift-amount button {
    padding: 8px;

    background: #111;
    color: #888;

    border: 1px solid #333;
    border-radius: 5px;
}

.shift-amount button.selected {
    background: #fff;
    color: #000;
}

.shift-buttons {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 7px;

    margin-top: 7px;
}

.shift-button {
    height: 52px;

    border-radius: 7px;

    font-size: 16px;
    font-weight: 700;
}

.push {
    background: #8e1818;
    color: #fff;

    border: 1px solid #e53935;
}

.pull {
    background: #185c25;
    color: #fff;

    border: 1px solid #43a047;
}

/* =========================
   CONTROLS
========================= */

.controls {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 6px;

    margin-top: 7px;
}

.controls button {
    padding: 8px;

    background: #111;
    color: #888;

    border: 1px solid #333;
    border-radius: 5px;
}

/* =========================
   PRODUCTION
========================= */

.production-button {
    position: fixed;

    right: 20px;
    bottom: 20px;

    z-index: 1000;

    padding: 11px 16px;

    background: #111;
    color: #fff;

    border: 1px solid #333;
    border-radius: 6px;
}

body.production-mode .production-button {
    display: none;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 700px) {

    .main {
        grid-template-columns: 1fr;

        text-align: center;

        padding: 25px;
    }

    .clock-area {
        align-items: center;
    }

    .next-area {
        padding-left: 0;
        margin-top: 35px;
    }

    .next-button {
        width: 90%;
    }
}

/* =========================
   LANDSCAPE PHONE
========================= */

@media
(max-height: 500px)
and (orientation: landscape) {

    .main {
        grid-template-columns: 58% 42%;

        padding: 3vh 5vw;
    }

    .clock {
        font-size: min(12vw, 95px);
    }

    .next-area {
        padding-left: 2vw;
    }

    .current-name {
        font-size: min(5vw, 38px);
    }

    .next-name {
        font-size: min(4vw, 32px);
    }

    .next-block {
        margin-top: 15px;
    }

    .next-button {
        margin-top: 15px;
        height: 55px;
    }
}
</style>
</head>

<body>

<main class="main">

    <section class="clock-area">

        <div class="label">
            CURRENT TIME
        </div>

        <div id="clock" class="clock">
            00:00:00
        </div>

        <div id="date" class="date">
            ---- / -- / -- ---
        </div>

    </section>


    <section class="next-area">

        <div class="current-label">
            CURRENT
        </div>

        <div id="currentName" class="current-name">
            開始前
        </div>

        <div id="currentTime" class="current-time">
            --:--
        </div>


        <div class="next-block">

            <div class="next-title">
                NEXT
            </div>

            <div id="nextName" class="next-name">
                --
            </div>

            <div id="nextTime" class="next-time">
                --:--
            </div>

            <div id="countdown" class="countdown">
                --:--:--
            </div>

        </div>


        <button
            id="nextButton"
            class="next-button"
            onclick="goNext(event)"
        >
            ▶ 次へ
        </button>

    </section>

</main>


<!-- TIMETABLE TAB -->

<button
    class="timetable-tab"
    onclick="toggleTimetable(event)"
>
    <span id="tabArrow">‹</span>
</button>


<!-- TIMETABLE -->

<aside id="side" class="side">

    <div class="side-header">

        <h2>
            TIME TABLE
        </h2>

        <button
            class="small-button"
            onclick="toggleSeconds(event)"
        >
            秒表示
        </button>

    </div>


    <div id="timeline" class="timeline"></div>


    <!-- ADD EVENT -->

    <div class="add-form">

        <input
            id="eventTime"
            type="time"
        >

        <input
            id="eventName"
            type="text"
            placeholder="進行名"
        >

        <button onclick="addEvent(event)">
            ＋ 進行を追加
        </button>

    </div>


    <!-- MANUAL SHIFT -->

    <div class="shift-section">

        <div class="shift-title">
            MANUAL SHIFT
        </div>

        <div class="shift-amount">

            <button
                id="shift1"
                onclick="selectShift(1,event)"
            >
                1分
            </button>

            <button
                id="shift5"
                class="selected"
                onclick="selectShift(5,event)"
            >
                5分
            </button>

            <button
                id="shift10"
                onclick="selectShift(10,event)"
            >
                10分
            </button>

        </div>


        <div class="shift-buttons">

            <button
                class="shift-button push"
                onclick="manualShift(1,event)"
            >
                ＋ 押す
            </button>

            <button
                class="shift-button pull"
                onclick="manualShift(-1,event)"
            >
                − 巻く
            </button>

        </div>

    </div>


    <div class="controls">

        <button onclick="clearEvents(event)">
            CLEAR
        </button>

        <button onclick="enterProductionMode(event)">
            本番モード
        </button>

    </div>

</aside>


<button
    class="production-button"
    onclick="enterProductionMode(event)"
>
    本番モード
</button>


<script>

/* =========================================================
   STORAGE
========================================================= */

const EVENTS_KEY =
    "stage_clock_original_events_v3";

const STATE_KEY =
    "stage_clock_state_v3";


/* =========================================================
   DEFAULT TIMETABLE
========================================================= */

const DEFAULT_EVENTS = [

    {
        id: makeId(),
        time: "19:00",
        name: "ARTIST 1"
    },

    {
        id: makeId(),
        time: "19:30",
        name: "転換"
    },

    {
        id: makeId(),
        time: "19:40",
        name: "ARTIST 2"
    },

    {
        id: makeId(),
        time: "20:10",
        name: "転換"
    },

    {
        id: makeId(),
        time: "20:20",
        name: "ARTIST 3"
    },

    {
        id: makeId(),
        time: "20:50",
        name: "END"
    }

];


let events =
    JSON.parse(
        localStorage.getItem(
            EVENTS_KEY
        )
    ) || DEFAULT_EVENTS;


/*
    state.currentIndex

    -1 = 開始前
     0 = 1番目
     1 = 2番目
*/

let state =
    JSON.parse(
        localStorage.getItem(
            STATE_KEY
        )
    ) || {

        currentIndex: -1,

        /*
            実際の開始時刻

            event.id : timestamp
        */

        actualStartTimes: {},

        /*
            各進行が元タイテから
            何分ズレたか
        */

        shifts: {}
    };


let shiftAmount = 5;

let showSeconds = true;


/* =========================================================
   ID
========================================================= */

function makeId() {

    if (
        window.crypto &&
        crypto.randomUUID
    ) {
        return crypto.randomUUID();
    }

    return (
        Date.now().toString(36) +
        Math.random()
            .toString(36)
            .slice(2)
    );
}


/* =========================================================
   SAVE
========================================================= */

function save() {

    localStorage.setItem(
        EVENTS_KEY,
        JSON.stringify(events)
    );

    localStorage.setItem(
        STATE_KEY,
        JSON.stringify(state)
    );
}


/* =========================================================
   TIME
========================================================= */

function timeToSeconds(time) {

    const [
        h,
        m
    ] =
        time
            .split(":")
            .map(Number);

    return (
        h * 3600 +
        m * 60
    );
}


function secondsToTime(seconds) {

    seconds =
        (
            seconds % 86400 +
            86400
        ) % 86400;


    const h =
        Math.floor(
            seconds / 3600
        );


    const m =
        Math.floor(
            (
                seconds % 3600
            ) / 60
        );


    return (
        String(h).padStart(2, "0") +
        ":" +
        String(m).padStart(2, "0")
    );
}


function getNowSeconds() {

    const now =
        new Date();

    return (
        now.getHours() * 3600 +
        now.getMinutes() * 60 +
        now.getSeconds()
    );
}


/* =========================================================
   NEXT INDEX
========================================================= */

function getNextIndex() {

    const next =
        state.currentIndex + 1;

    if (
        next >= events.length
    ) {
        return -1;
    }

    return next;
}


/* =========================================================
   CALCULATE DIFFERENCE
========================================================= */

function calculateDifference(
    planned,
    actual
) {

    let diff =
        actual -
        planned;


    /*
        日付またぎ対策
    */

    if (diff > 43200) {
        diff -= 86400;
    }

    if (diff < -43200) {
        diff += 86400;
    }


    /*
        秒は丸めて分にする
    */

    return Math.round(
        diff / 60
    );
}


/* =========================================================
   NEXT
========================================================= */

/*
    ★重要

    「次へ」を押した瞬間、

    予定時刻
          ↓
    実際に押した時刻

    の差を計算。

    その差を「その進行の実績」として
    保存する。

    さらに、

    現在までのズレ
          +
    今回の進行で発生したズレ

    ではなく、

    「その進行が実際に何時に始まったか」

    を基準にする。

    これにより、

    押す → 転換で巻く → ON TIME

    が可能になる。
*/

function goNext(e) {

    if (e) {
        e.stopPropagation();
    }


    const nextIndex =
        getNextIndex();


    if (
        nextIndex === -1
    ) {
        return;
    }


    const event =
        events[nextIndex];


    /*
        予定時刻
    */

    const planned =
        timeToSeconds(
            event.time
        );


    /*
        実際に「次へ」を
        押した時刻
    */

    const actual =
        getNowSeconds();


    /*
        差分
    */

    const diff =
        calculateDifference(
            planned,
            actual
        );


    /*
        実績時刻を保存
    */

    state.actualStartTimes[
        event.id
    ] =
        actual;


    /*
        元タイテとの差
    */

    state.shifts[
        event.id
    ] =
        diff;


    /*
        現在進行を更新
    */

    state.currentIndex =
        nextIndex;


    save();

    renderTimeline();
    updateDisplay();
}


/* =========================================================
   MANUAL SHIFT
========================================================= */

/*
    手動の＋/−は、

    「現在進行以降を実際の時間として
     変更したい」

    とき用。

    元タイテは絶対に変更しない。
*/

function manualShift(
    direction,
    e
) {

    if (e) {
        e.stopPropagation();
    }


    let index =
        state.currentIndex;


    if (
        index < 0
    ) {
        index = 0;
    }


    if (
        index >= events.length
    ) {
        return;
    }


    const amount =
        direction *
        shiftAmount;


    /*
        現在の実績時刻を取得
    */

    const currentEvent =
        events[index];


    const currentShift =
        state.shifts[
            currentEvent.id
        ] || 0;


    /*
        現在進行から後ろを
        相対的に変更
    */

    for (
        let i = index;
        i < events.length;
        i++
    ) {

        const id =
            events[i].id;


        const old =
            state.shifts[id] || 0;


        state.shifts[id] =
            old + amount;
    }


    save();

    renderTimeline();
    updateDisplay();
}


/* =========================================================
   SHIFT SELECT
========================================================= */

function selectShift(
    amount,
    e
) {

    if (e) {
        e.stopPropagation();
    }


    shiftAmount =
        amount;


    document
        .querySelectorAll(
            ".shift-amount button"
        )
        .forEach(
            button =>
                button.classList.remove(
                    "selected"
                )
        );


    document
        .getElementById(
            "shift" + amount
        )
        .classList.add(
            "selected"
        );
}


/* =========================================================
   ACTUAL TIME FOR EVENT
========================================================= */

function getActualTime(
    index
) {

    const event =
        events[index];


    const shift =
        state.shifts[
            event.id
        ] || 0;


    return secondsToTime(
        timeToSeconds(
            event.time
        ) +
        shift * 60
    );
}


/* =========================================================
   RENDER
========================================================= */

function renderTimeline() {

    const timeline =
        document.getElementById(
            "timeline"
        );


    timeline.innerHTML = "";


    events.forEach(
        (event, index) => {

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "event";


            /*
                現在
            */

            if (
                index ===
                state.currentIndex
            ) {

                div.classList.add(
                    "current"
                );
            }


            /*
                完了
            */

            if (
                index <
                state.currentIndex
            ) {

                div.classList.add(
                    "completed"
                );
            }


            const shift =
                state.shifts[
                    event.id
                ] || 0;


            let actualHTML = "";


            /*
                押し
            */

            if (
                shift > 0
            ) {

                actualHTML = `

                    <div class="
                        actual-time
                        push
                    ">
                        ${getActualTime(index)}
                    </div>

                    <div class="
                        shift-label
                        push
                    ">
                        ＋${shift}min
                    </div>

                `;
            }


            /*
                巻き
            */

            else if (
                shift < 0
            ) {

                actualHTML = `

                    <div class="
                        actual-time
                        pull
                    ">
                        ${getActualTime(index)}
                    </div>

                    <div class="
                        shift-label
                        pull
                    ">
                        −${Math.abs(shift)}min
                    </div>

                `;
            }


            /*
                ON TIME
            */

            else if (
                index <=
                state.currentIndex
            ) {

                actualHTML = `

                    <div class="on-time">
                        ON TIME
                    </div>

                `;
            }


            /*
                現在バッジ
            */

            let badge = "";


            if (
                index ===
                state.currentIndex
            ) {

                badge = `

                    <div class="event-badge">
                        ● NOW
                    </div>

                `;
            }


            div.innerHTML = `

                <div
                    class="event-time-original"
                >
                    ${event.time}
                </div>


                <div>

                    <div class="event-name">
                        ${escapeHTML(
                            event.name
                        )}
                    </div>

                    ${actualHTML}

                    ${badge}

                </div>


                <button
                    class="delete"
                    onclick="
                        deleteEvent(
                            ${index},
                            event
                        )
                    "
                >
                    ×
                </button>

            `;


            timeline.appendChild(
                div
            );
        }
    );
}


/* =========================================================
   DISPLAY
========================================================= */

function updateDisplay() {

    /*
        CURRENT
    */

    const currentIndex =
        state.currentIndex;


    if (
        currentIndex >= 0
    ) {

        const current =
            events[
                currentIndex
            ];


        document.getElementById(
            "currentName"
        ).textContent =
            current.name;


        document.getElementById(
            "currentTime"
        ).textContent =
            getActualTime(
                currentIndex
            );

    }

    else {

        document.getElementById(
            "currentName"
        ).textContent =
            "開始前";


        document.getElementById(
            "currentTime"
        ).textContent =
            "--:--";
    }


    /*
        NEXT
    */

    const nextIndex =
        getNextIndex();


    if (
        nextIndex === -1
    ) {

        document.getElementById(
            "nextName"
        ).textContent =
            "本日の進行終了";


        document.getElementById(
            "nextTime"
        ).textContent =
            "--:--";


        document.getElementById(
            "countdown"
        ).textContent =
            "--:--:--";


        document.getElementById(
            "nextButton"
        ).disabled =
            true;


        return;
    }


    const next =
        events[nextIndex];


    document.getElementById(
        "nextName"
    ).textContent =
        next.name;


    document.getElementById(
        "nextTime"
    ).textContent =
        getActualTime(
            nextIndex
        );


    document.getElementById(
        "nextButton"
    ).disabled =
        false;


    /*
        カウントダウン
    */

    const target =
        timeToSeconds(
            getActualTime(
                nextIndex
            )
        );


    let diff =
        target -
        getNowSeconds();


    if (
        diff < 0
    ) {

        diff += 86400;
    }


    const h =
        Math.floor(
            diff / 3600
        );


    const m =
        Math.floor(
            (
                diff % 3600
            ) / 60
        );


    const s =
        diff % 60;


    document.getElementById(
        "countdown"
    ).textContent =

        String(h).padStart(2, "0") +
        ":" +
        String(m).padStart(2, "0") +
        ":" +
        String(s).padStart(2, "0");
}


/* =========================================================
   CLOCK
========================================================= */

function updateClock() {

    const now =
        new Date();


    const h =
        String(
            now.getHours()
        ).padStart(2, "0");


    const m =
        String(
            now.getMinutes()
        ).padStart(2, "0");


    const s =
        String(
            now.getSeconds()
        ).padStart(2, "0");


    document.getElementById(
        "clock"
    ).textContent =

        showSeconds
            ? `${h}:${m}:${s}`
            : `${h}:${m}`;


    const days = [
        "SUN",
        "MON",
        "TUE",
        "WED",
        "THU",
        "FRI",
        "SAT"
    ];


    document.getElementById(
        "date"
    ).textContent =

        `${now.getFullYear()} / ` +
        `${String(
            now.getMonth() + 1
        ).padStart(2, "0")} / ` +
        `${String(
            now.getDate()
        ).padStart(2, "0")} ` +
        `${days[now.getDay()]}`;


    updateDisplay();
}


/*
    次の秒の境界に合わせる
*/

function preciseClock() {

    updateClock();


    const now =
        new Date();


    const delay =
        1000 -
        now.getMilliseconds();


    setTimeout(
        preciseClock,
        delay
    );
}


/* =========================================================
   ADD EVENT
========================================================= */

function addEvent(e) {

    if (e) {
        e.stopPropagation();
    }


    const time =
        document.getElementById(
            "eventTime"
        ).value;


    const name =
        document.getElementById(
            "eventName"
        ).value.trim();


    if (
        !time ||
        !name
    ) {

        alert(
            "時刻と進行名を入力してください。"
        );

        return;
    }


    events.push({

        id: makeId(),

        time,

        name
    });


    /*
        元タイテ順
    */

    events.sort(
        (a, b) =>
            timeToSeconds(
                a.time
            ) -
            timeToSeconds(
                b.time
            )
    );


    save();

    renderTimeline();
    updateDisplay();


    document.getElementById(
        "eventTime"
    ).value = "";


    document.getElementById(
        "eventName"
    ).value = "";
}


/* =========================================================
   DELETE
========================================================= */

function deleteEvent(
    index,
    e
) {

    if (e) {
        e.stopPropagation();
    }


    if (
        !confirm(
            "この進行を削除しますか？"
        )
    ) {
        return;
    }


    const id =
        events[index].id;


    events.splice(
        index,
        1
    );


    delete state.shifts[id];

    delete state.actualStartTimes[id];


    if (
        index <=
        state.currentIndex
    ) {

        state.currentIndex--;
    }


    save();

    renderTimeline();
    updateDisplay();
}


/* =========================================================
   CLEAR
========================================================= */

function clearEvents(e) {

    if (e) {
        e.stopPropagation();
    }


    if (
        !confirm(
            "タイムテーブルと進行状況をリセットしますか？"
        )
    ) {
        return;
    }


    events = [];


    state = {

        currentIndex: -1,

        actualStartTimes: {},

        shifts: {}
    };


    save();

    renderTimeline();
    updateDisplay();
}


/* =========================================================
   TIMETABLE
========================================================= */

function toggleTimetable(e) {

    if (e) {
        e.stopPropagation();
    }


    document
        .getElementById("side")
        .classList.toggle("open");


    document.body.classList.toggle(
        "timetable-open"
    );
}


function closeTimetable() {

    document
        .getElementById("side")
        .classList.remove("open");


    document.body.classList.remove(
        "timetable-open"
    );
}


/* =========================================================
   SECONDS
========================================================= */

function toggleSeconds(e) {

    if (e) {
        e.stopPropagation();
    }


    showSeconds =
        !showSeconds;


    updateClock();
}


/* =========================================================
   PRODUCTION MODE
========================================================= */

async function enterProductionMode(e) {

    if (e) {
        e.stopPropagation();
    }


    closeTimetable();


    document.body.classList.add(
        "production-mode"
    );


    try {

        if (
            !document.fullscreenElement
        ) {

            await document
                .documentElement
                .requestFullscreen();
        }

    } catch (error) {}
}


/* =========================================================
   ESC
========================================================= */

document.addEventListener(
    "keydown",
    e => {

        if (
            e.key === "Escape"
        ) {

            if (
                document.body.classList.contains(
                    "timetable-open"
                )
            ) {

                closeTimetable();

            }
            else {

                document.body.classList.remove(
                    "production-mode"
                );

                if (
                    document.fullscreenElement
                ) {

                    document
                        .exitFullscreen()
                        .catch(
                            () => {}
                        );
                }
            }
        }
    }
);


/* =========================================================
   SWIPE
========================================================= */

let touchStartX = 0;


document.addEventListener(
    "touchstart",
    e => {

        if (
            e.touches.length !== 1
        ) {
            return;
        }


        touchStartX =
            e.touches[0].clientX;

    },
    {
        passive: true
    }
);


document.addEventListener(
    "touchend",
    e => {

        if (
            e.changedTouches.length !== 1
        ) {
            return;
        }


        const x =
            e.changedTouches[0].clientX;


        const dx =
            x -
            touchStartX;


        /*
            右端から左へ
        */

        if (
            dx < -70 &&

            touchStartX >
                window.innerWidth - 100 &&

            !document.body.classList.contains(
                "timetable-open"
            )
        ) {

            toggleTimetable();
        }


        /*
            パネルを閉じる
        */

        if (
            dx > 70 &&

            document.body.classList.contains(
                "timetable-open"
            )
        ) {

            closeTimetable();
        }

    },
    {
        passive: true
    }
);


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(text) {

    return String(text)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );
}


/* =========================================================
   INIT
========================================================= */

events.forEach(
    event => {

        if (!event.id) {
            event.id = makeId();
        }
    }
);


save();

renderTimeline();

updateDisplay();

preciseClock();

</script>

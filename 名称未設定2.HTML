<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>STAGE CLOCK</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;

    background: #050505;
    color: #fff;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;

    overflow: hidden;

    touch-action: manipulation;
}

button,
input {
    font-family: inherit;
}


/* ==================================================
   MAIN
================================================== */

.main {

    width: 100%;
    height: 100dvh;

    display: grid;

    grid-template-columns:
        55% 45%;

    align-items: center;

    padding:
        5vh
        7vw;

    position: relative;
}


/* ==================================================
   CLOCK AREA
================================================== */

.clock-area {

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: flex-start;
}


.label {

    color: #666;

    font-size:
        clamp(9px, 1.3vw, 15px);

    letter-spacing: 0.45em;

    margin-bottom:
        2vh;
}


.clock {

    font-size:
        clamp(55px, 10vw, 150px);

    font-weight: 700;

    line-height: 0.95;

    letter-spacing:
        0.02em;

    font-variant-numeric:
        tabular-nums;
}


.date {

    margin-top:
        2vh;

    color: #666;

    font-size:
        clamp(11px, 1.5vw, 18px);

    letter-spacing:
        0.25em;
}


/* ==================================================
   NEXT AREA
================================================== */

.next-area {

    display: flex;

    flex-direction: column;

    justify-content: center;

    align-items: flex-start;

    padding-left:
        3vw;
}


.next-title {

    color: #666;

    font-size:
        clamp(9px, 1.2vw, 14px);

    letter-spacing:
        0.5em;
}


.next-name {

    margin-top:
        1.5vh;

    font-size:
        clamp(24px, 4vw, 60px);

    font-weight: 700;

    line-height: 1.1;
}


.next-time {

    margin-top:
        1vh;

    color: #777;

    font-size:
        clamp(13px, 1.8vw, 22px);

    font-variant-numeric:
        tabular-nums;
}


.countdown {

    margin-top:
        1vh;

    font-size:
        clamp(30px, 5vw, 70px);

    font-weight: 700;

    font-variant-numeric:
        tabular-nums;
}


/* ==================================================
   TAB
================================================== */

.timetable-tab {

    position: fixed;

    right: 0;

    top: 50%;

    transform:
        translateY(-50%);

    width: 46px;
    height: 92px;

    border: 1px solid #333;

    border-right: none;

    border-radius:
        46px 0 0 46px;

    background: #111;

    color: #fff;

    z-index: 3000;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 28px;

    padding: 0;

    cursor: pointer;
}


#tabArrow {

    transition:
        transform 0.25s ease;
}


body.timetable-open #tabArrow {

    transform:
        rotate(180deg);

}


/* ==================================================
   SIDE PANEL
================================================== */

.side {

    position: fixed;

    top: 0;
    right: 0;

    width:
        min(88vw, 470px);

    height: 100dvh;

    background: #070707;

    border-left:
        1px solid #222;

    z-index: 2500;

    padding:
        18px 20px;

    display: flex;

    flex-direction: column;

    transform:
        translateX(100%);

    transition:
        transform 0.25s ease;
}


.side.open {

    transform:
        translateX(0);

}


body.timetable-open
.timetable-tab {

    right:
        min(88vw, 470px);

}


/* ==================================================
   SIDE HEADER
================================================== */

.side-header {

    display: flex;

    align-items: center;

    justify-content:
        space-between;
}


.side-header h2 {

    margin: 0;

    font-size:
        14px;

    letter-spacing:
        0.35em;
}


.side-header button {

    background: #111;

    border:
        1px solid #333;

    color: #aaa;

    padding:
        8px 12px;

    border-radius: 6px;
}


/* ==================================================
   TIMELINE
================================================== */

.timeline {

    flex: 1;

    overflow-y: auto;

    overscroll-behavior:
        contain;

    margin-top:
        12px;

    padding-right:
        3px;
}


.event {

    display: grid;

    grid-template-columns:
        68px 1fr 28px;

    gap: 8px;

    align-items: start;

    border-left:
        3px solid #303030;

    padding:
        10px 8px;

    margin-bottom:
        5px;

    border-radius:
        0 6px 6px 0;
}


.event.active {

    background:
        #181818;

    border-left-color:
        #fff;

}


.event.passed {

    opacity:
        0.28;

}


.event-time {

    font-size:
        13px;

    font-variant-numeric:
        tabular-nums;

}


.event-name {

    font-size:
        15px;

    font-weight:
        600;

    line-height:
        1.35;
}


/* ==================================================
   SHIFT
================================================== */

.event-shift {

    margin-top:
        3px;

    font-size:
        12px;

    font-weight:
        700;

    font-variant-numeric:
        tabular-nums;
}


.event-shift.plus {

    color:
        #ff4545;

}


.event-shift.minus {

    color:
        #55c96a;

}


/* ==================================================
   DELETE
================================================== */

.delete {

    background:
        transparent;

    border:
        none;

    color:
        #555;

    font-size:
        20px;

    padding:
        0;

}


/* ==================================================
   ADD
================================================== */

.add-form {

    display: grid;

    grid-template-columns:
        90px 1fr;

    gap:
        6px;

    margin-top:
        8px;
}


.add-form input {

    min-width: 0;

    background:
        #111;

    color:
        #fff;

    border:
        1px solid #333;

    border-radius:
        5px;

    padding:
        9px;

    font-size:
        13px;

    outline:
        none;
}


.add-form button {

    grid-column:
        1 / 3;

    background:
        #111;

    color:
        #fff;

    border:
        1px solid #333;

    border-radius:
        5px;

    padding:
        10px;
}


/* ==================================================
   SHIFT CONTROLS
================================================== */

.shift-section {

    border-top:
        1px solid #222;

    margin-top:
        9px;

    padding-top:
        9px;
}


.shift-title {

    color:
        #666;

    font-size:
        9px;

    letter-spacing:
        0.3em;

    margin-bottom:
        7px;
}


.shift-amount {

    display:
        grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap:
        5px;

    margin-bottom:
        6px;
}


.shift-amount button {

    padding:
        7px 2px;

    background:
        #111;

    color:
        #888;

    border:
        1px solid #333;

    border-radius:
        5px;
}


.shift-amount button.selected {

    background:
        #fff;

    color:
        #000;

    border-color:
        #fff;
}


.shift-buttons {

    display:
        grid;

    grid-template-columns:
        1fr 1fr;

    gap:
        7px;
}


.shift-button {

    height:
        52px;

    border-radius:
        7px;

    font-size:
        16px;

    font-weight:
        700;

    border:
        1px solid;

}


.shift-button.push {

    background:
        #a51c1c;

    border-color:
        #e53935;

    color:
        #fff;
}


.shift-button.pull {

    background:
        #185d25;

    border-color:
        #43a047;

    color:
        #fff;
}


/* ==================================================
   BOTTOM
================================================== */

.controls {

    display:
        grid;

    grid-template-columns:
        1fr 1fr;

    gap:
        6px;

    margin-top:
        7px;
}


.controls button {

    background:
        #111;

    color:
        #888;

    border:
        1px solid #333;

    border-radius:
        5px;

    padding:
        7px;
}


/* ==================================================
   PRODUCTION
================================================== */

.production-button {

    position:
        fixed;

    right:
        20px;

    bottom:
        18px;

    background:
        #111;

    color:
        #aaa;

    border:
        1px solid #333;

    border-radius:
        6px;

    padding:
        10px 15px;

    z-index:
        1000;
}


body.production-mode
.production-button {

    display:
        none;
}


body.production-mode {

    cursor:
        none;
}


/* ==================================================
   MOBILE LANDSCAPE
================================================== */

@media
(max-width: 900px)
and (orientation: landscape) {

    .main {

        grid-template-columns:
            58% 42%;

        padding:
            4vh 5vw;
    }


    .clock {

        font-size:
            min(11vw, 105px);
    }


    .next-name {

        font-size:
            min(5vw, 40px);
    }


    .countdown {

        font-size:
            min(6vw, 48px);
    }


    .side {

        width:
            min(82vw, 430px);

        padding:
            12px 15px;
    }


    body.timetable-open
    .timetable-tab {

        right:
            min(82vw, 430px);
    }


    .shift-button {

        height:
            48px;
    }

}


/* ==================================================
   VERY SMALL LANDSCAPE
================================================== */

@media
(max-height: 450px)
and (orientation: landscape) {

    .main {

        padding:
            3vh 4vw;
    }


    .label {

        margin-bottom:
            1vh;
    }


    .date {

        margin-top:
            1vh;
    }


    .next-name {

        margin-top:
            1vh;
    }


    .next-time {

        margin-top:
            0.5vh;
    }


    .countdown {

        margin-top:
            0.5vh;
    }


    .event {

        padding:
            7px 6px;

        margin-bottom:
            3px;
    }


    .shift-section {

        padding-top:
            6px;
    }

}


/* ==================================================
   PORTRAIT WARNING
================================================== */

.portrait-warning {

    display:
        none;

    position:
        fixed;

    inset:
        0;

    background:
        #050505;

    z-index:
        9999;

    align-items:
        center;

    justify-content:
        center;

    text-align:
        center;

    padding:
        30px;

}


@media
(orientation: portrait) {

    .portrait-warning {

        display:
            flex;
    }

}


</style>
</head>


<body>


<!-- ================================================
     PORTRAIT WARNING
================================================= -->

<div class="portrait-warning">

    <div>

        <div style="
            font-size:45px;
            margin-bottom:20px;
        ">
            ↻
        </div>

        <div style="
            font-size:18px;
            font-weight:bold;
        ">
            スマートフォンを<br>
            横向きにしてください
        </div>

    </div>

</div>


<!-- ================================================
     MAIN
================================================= -->

<main
    class="main"
    onclick="mainClick(event)"
>


    <!-- CLOCK -->

    <section
        class="clock-area"
    >

        <div class="label">
            CURRENT TIME
        </div>

        <div
            class="clock"
            id="clock"
        >
            00:00:00
        </div>

        <div
            class="date"
            id="date"
        >
            ---- / -- / -- ---
        </div>

    </section>


    <!-- NEXT -->

    <section
        class="next-area"
    >

        <div class="next-title">
            NEXT
        </div>

        <div
            class="next-name"
            id="nextName"
        >
            --
        </div>

        <div
            class="next-time"
            id="nextTime"
        >
            --:--
        </div>

        <div
            class="countdown"
            id="countdown"
        >
            --:--:--
        </div>

    </section>


</main>


<!-- ================================================
     TAB
================================================= -->

<button
    class="timetable-tab"
    id="tabButton"
    onclick="toggleTimetable(event)"
>

    <span id="tabArrow">
        ‹
    </span>

</button>


<!-- ================================================
     SIDE
================================================= -->

<aside
    class="side"
    id="side"
>


    <div class="side-header">

        <h2>
            TIME TABLE
        </h2>

        <button
            onclick="toggleSeconds(event)"
        >
            秒表示
        </button>

    </div>


    <!-- TIMELINE -->

    <div
        class="timeline"
        id="timeline"
    ></div>


    <!-- ADD -->

    <div
        class="add-form"
    >

        <input
            type="time"
            id="eventTime"
        >

        <input
            type="text"
            id="eventName"
            placeholder="進行名"
        >

        <button
            onclick="addEvent(event)"
        >
            ＋ 進行を追加
        </button>

    </div>


    <!-- SHIFT -->

    <div
        class="shift-section"
    >

        <div
            class="shift-title"
        >
            SHIFT
        </div>


        <div
            class="shift-amount"
        >

            <button
                id="shift1"
                onclick="selectShift(1,event)"
            >
                1分
            </button>

            <button
                id="shift5"
                class="selected"
                onclick="selectShift(5,event)"
            >
                5分
            </button>

            <button
                id="shift10"
                onclick="selectShift(10,event)"
            >
                10分
            </button>

        </div>


        <div
            class="shift-buttons"
        >

            <button
                class="shift-button push"
                onclick="shiftTimetable(1,event)"
            >
                ＋ 押す
            </button>

            <button
                class="shift-button pull"
                onclick="shiftTimetable(-1,event)"
            >
                − 巻く
            </button>

        </div>

    </div>


    <!-- BOTTOM -->

    <div
        class="controls"
    >

        <button
            onclick="clearEvents(event)"
        >
            CLEAR
        </button>

        <button
            onclick="enterProductionMode(event)"
        >
            本番モード
        </button>

    </div>

</aside>


<!-- ================================================
     PRODUCTION BUTTON
================================================= -->

<button
    class="production-button"
    onclick="enterProductionMode(event)"
>
    本番モード
</button>


<script>

/* ==================================================
   DATA
================================================== */

let events =
    JSON.parse(
        localStorage.getItem(
            "stageEvents"
        )
    ) || [

        {
            id:
                crypto.randomUUID(),

            time:
                "22:30",

            name:
                "OPEN"
        },

        {
            id:
                crypto.randomUUID(),

            time:
                "22:40",

            name:
                "BAND 1"
        },

        {
            id:
                crypto.randomUUID(),

            time:
                "23:00",

            name:
                "MC"
        },

        {
            id:
                crypto.randomUUID(),

            time:
                "23:10",

            name:
                "BAND 2"
        },

        {
            id:
                crypto.randomUUID(),

            time:
                "23:40",

            name:
                "END"
        }

    ];


let shiftData =
    JSON.parse(
        localStorage.getItem(
            "stageShiftData"
        )
    ) || [];


let shiftAmount = 5;

let showSeconds = true;


/* ==================================================
   SAVE
================================================== */

function saveEvents() {

    localStorage.setItem(
        "stageEvents",
        JSON.stringify(events)
    );

}


function saveShiftData() {

    localStorage.setItem(
        "stageShiftData",
        JSON.stringify(shiftData)
    );

}


/* ==================================================
   CLOCK
================================================== */

function getNow() {

    return new Date();

}


function timeToMinutes(time) {

    const parts =
        time.split(":");

    return (
        Number(parts[0]) * 60 +
        Number(parts[1])
    );

}


function minutesToTime(minutes) {

    minutes =
        (
            minutes % 1440 +
            1440
        ) % 1440;


    const h =
        Math.floor(
            minutes / 60
        );


    const m =
        minutes % 60;


    return (
        String(h).padStart(2,"0")
        +
        ":"
        +
        String(m).padStart(2,"0")
    );

}


/* ==================================================
   TAB
================================================== */

function toggleTimetable(e) {

    if (e) {
        e.stopPropagation();
    }


    const side =
        document.getElementById(
            "side"
        );


    side.classList.toggle(
        "open"
    );


    document.body.classList.toggle(
        "timetable-open"
    );

}


function closeTimetable() {

    document
        .getElementById("side")
        .classList.remove(
            "open"
        );


    document.body.classList.remove(
        "timetable-open"
    );

}


function mainClick(e) {

    /*
        メイン画面をタップしても
        タイムテーブルを閉じない。

        本番中の誤操作防止。
    */

}


/* ==================================================
   CURRENT EVENT
================================================== */

function getCurrentEvent() {

    const now =
        getNow();


    const nowMinutes =
        now.getHours() * 60 +
        now.getMinutes();


    let current =
        null;


    for (
        const item of events
    ) {

        if (
            timeToMinutes(
                item.time
            )
            <=
            nowMinutes
        ) {

            current =
                item;

        }

    }


    return current;

}


/* ==================================================
   SHIFT
================================================== */

function getShiftForEvent(id) {

    const item =
        shiftData.find(
            x =>
                x.eventId === id
        );


    return item
        ? item.amount
        : 0;

}


function shiftTimetable(
    direction,
    e
) {

    if (e) {
        e.stopPropagation();
    }


    const current =
        getCurrentEvent();


    if (!current) {

        alert(
            "現在進行中の項目がありません"
        );

        return;

    }


    const change =
        shiftAmount *
        direction;


    /*
        現在の進行に履歴を追加
    */

    let shift =
        shiftData.find(
            x =>
                x.eventId ===
                current.id
        );


    if (!shift) {

        shift = {

            eventId:
                current.id,

            amount:
                change

        };


        shiftData.push(
            shift
        );

    }
    else {

        shift.amount +=
            change;

    }


    /*
        現在の進行以降を移動
    */

    const currentIndex =
        events.findIndex(
            x =>
                x.id ===
                current.id
        );


    for (
        let i = currentIndex;
        i < events.length;
        i++
    ) {

        const oldTime =
            timeToMinutes(
                events[i].time
            );


        events[i].time =
            minutesToTime(
                oldTime +
                change
            );

    }


    /*
        ±0なら表示を消す
    */

    if (
        shift.amount === 0
    ) {

        shiftData =
            shiftData.filter(
                x =>
                    x.eventId !==
                    current.id
            );

    }


    saveEvents();

    saveShiftData();

    renderTimeline();

}


/* ==================================================
   SHIFT SELECT
================================================== */

function selectShift(
    amount,
    e
) {

    if (e) {
        e.stopPropagation();
    }


    shiftAmount =
        amount;


    document
        .querySelectorAll(
            ".shift-amount button"
        )
        .forEach(
            button => {

                button.classList.remove(
                    "selected"
                );

            }
        );


    document
        .getElementById(
            "shift" + amount
        )
        .classList.add(
            "selected"
        );

}


/* ==================================================
   TIMELINE
================================================== */

function renderTimeline() {

    const timeline =
        document.getElementById(
            "timeline"
        );


    timeline.innerHTML = "";


    events.forEach(
        (item,index) => {

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "event";


            div.dataset.eventId =
                item.id;


            const shift =
                getShiftForEvent(
                    item.id
                );


            let shiftHTML =
                "";


            if (
                shift > 0
            ) {

                shiftHTML =

                    `<div class="
                        event-shift plus
                    ">
                        ＋${shift}min
                    </div>`;

            }


            else if (
                shift < 0
            ) {

                shiftHTML =

                    `<div class="
                        event-shift minus
                    ">
                        −${Math.abs(shift)}min
                    </div>`;

            }


            div.innerHTML = `

                <div class="event-time">
                    ${item.time}
                </div>

                <div>
                    <div class="event-name">
                        ${escapeHTML(item.name)}
                    </div>

                    ${shiftHTML}
                </div>

                <button
                    class="delete"
                    onclick="
                        deleteEvent(${index},event)
                    "
                >
                    ×
                </button>

            `;


            timeline.appendChild(
                div
            );

        }
    );


    updateNext();

}


/* ==================================================
   ADD
================================================== */

function addEvent(e) {

    if (e) {
        e.stopPropagation();
    }


    const time =
        document.getElementById(
            "eventTime"
        ).value;


    const name =
        document.getElementById(
            "eventName"
        ).value.trim();


    if (
        !time ||
        !name
    ) {

        alert(
            "時刻と進行名を入力してください"
        );

        return;

    }


    events.push({

        id:
            crypto.randomUUID(),

        time:
            time,

        name:
            name

    });


    events.sort(
        (a,b) =>
            timeToMinutes(a.time)
            -
            timeToMinutes(b.time)
    );


    saveEvents();

    renderTimeline();


    document.getElementById(
        "eventTime"
    ).value = "";


    document.getElementById(
        "eventName"
    ).value = "";

}


/* ==================================================
   DELETE
================================================== */

function deleteEvent(
    index,
    e
) {

    if (e) {
        e.stopPropagation();
    }


    const id =
        events[index].id;


    events.splice(
        index,
        1
    );


    shiftData =
        shiftData.filter(
            x =>
                x.eventId !== id
        );


    saveEvents();

    saveShiftData();

    renderTimeline();

}


/* ==================================================
   CLEAR
================================================== */

function clearEvents(e) {

    if (e) {
        e.stopPropagation();
    }


    if (
        !confirm(
            "タイムテーブルを全て削除しますか？"
        )
    ) {

        return;

    }


    events = [];

    shiftData = [];


    saveEvents();

    saveShiftData();

    renderTimeline();

}


/* ==================================================
   NEXT
================================================== */

function updateNext() {

    const now =
        getNow();


    const currentSeconds =
        now.getHours() * 3600 +
        now.getMinutes() * 60 +
        now.getSeconds();


    let next =
        null;


    let nowMinutes =
        now.getHours() * 60 +
        now.getMinutes();


    for (
        const item of events
    ) {

        if (
            timeToMinutes(item.time)
            >
            nowMinutes
        ) {

            next =
                item;

            break;

        }

    }


    /*
        ACTIVE
    */

    document
        .querySelectorAll(
            ".event"
        )
        .forEach(
            element => {

                element.classList.remove(
                    "active",
                    "passed"
                );


                const item =
                    events.find(
                        x =>
                            x.id ===
                            element.dataset.eventId
                    );


                if (!item) {
                    return;
                }


                if (
                    timeToMinutes(item.time)
                    <=
                    nowMinutes
                ) {

                    element.classList.add(
                        "passed"
                    );

                }


                if (
                    next &&
                    item.id ===
                    next.id
                ) {

                    element.classList.remove(
                        "passed"
                    );

                    element.classList.add(
                        "active"
                    );

                }

            }
        );


    if (!next) {

        document.getElementById(
            "nextName"
        ).textContent =
            "本日の進行終了";


        document.getElementById(
            "nextTime"
        ).textContent =
            "--:--";


        document.getElementById(
            "countdown"
        ).textContent =
            "--:--:--";


        return;

    }


    document.getElementById(
        "nextName"
    ).textContent =
        next.name;


    document.getElementById(
        "nextTime"
    ).textContent =
        next.time;


    /*
        COUNTDOWN
    */

    let targetSeconds =
        timeToMinutes(
            next.time
        ) * 60;


    if (
        targetSeconds <=
        currentSeconds
    ) {

        targetSeconds +=
            86400;

    }


    const diff =
        targetSeconds -
        currentSeconds;


    const hours =
        Math.floor(
            diff / 3600
        );


    const minutes =
        Math.floor(
            (diff % 3600) / 60
        );


    const seconds =
        diff % 60;


    document.getElementById(
        "countdown"
    ).textContent =

        String(hours).padStart(2,"0")
        +
        ":"
        +
        String(minutes).padStart(2,"0")
        +
        ":"
        +
        String(seconds).padStart(2,"0");

}


/* ==================================================
   CLOCK
================================================== */

function updateClock() {

    const now =
        getNow();


    const h =
        String(
            now.getHours()
        ).padStart(2,"0");


    const m =
        String(
            now.getMinutes()
        ).padStart(2,"0");


    const s =
        String(
            now.getSeconds()
        ).padStart(2,"0");


    document.getElementById(
        "clock"
    ).textContent =

        showSeconds

        ? `${h}:${m}:${s}`

        : `${h}:${m}`;


    const days = [

        "SUN",
        "MON",
        "TUE",
        "WED",
        "THU",
        "FRI",
        "SAT"

    ];


    document.getElementById(
        "date"
    ).textContent =

        `${now.getFullYear()} / ` +
        `${String(now.getMonth()+1).padStart(2,"0")} / ` +
        `${String(now.getDate()).padStart(2,"0")} ` +
        `${days[now.getDay()]}`;


    updateNext();

}


/* ==================================================
   EXACT SECOND UPDATE
================================================== */

function preciseClock() {

    updateClock();


    const now =
        new Date();


    const delay =
        1000 -
        now.getMilliseconds();


    setTimeout(
        preciseClock,
        delay
    );

}


/* ==================================================
   SECONDS
================================================== */

function toggleSeconds(e) {

    if (e) {
        e.stopPropagation();
    }


    showSeconds =
        !showSeconds;


    updateClock();

}


/* ==================================================
   PRODUCTION MODE
================================================== */

async function enterProductionMode(e) {

    if (e) {
        e.stopPropagation();
    }


    closeTimetable();


    document.body.classList.add(
        "production-mode"
    );


    /*
        Fullscreen
    */

    try {

        if (
            !document.fullscreenElement
        ) {

            await document
                .documentElement
                .requestFullscreen();

        }

    }
    catch(err) {}


    /*
        Wake Lock
    */

    requestWakeLock();

}


function exitProductionMode() {

    document.body.classList.remove(
        "production-mode"
    );


    if (
        document.fullscreenElement
    ) {

        document.exitFullscreen()
            .catch(
                () => {}
            );

    }

}


/* ==================================================
   WAKE LOCK
================================================== */

let wakeLock = null;


async function requestWakeLock() {

    if (
        !("wakeLock" in navigator)
    ) {

        return;

    }


    try {

        wakeLock =
            await navigator
                .wakeLock
                .request("screen");

    }
    catch(err) {

        console.log(
            "Wake Lock unavailable"
        );

    }

}


document.addEventListener(
    "visibilitychange",
    async () => {

        if (
            document.visibilityState ===
            "visible" &&
            document.body.classList.contains(
                "production-mode"
            )
        ) {

            await requestWakeLock();

        }

    }
);


/* ==================================================
   FULLSCREEN
================================================== */

document.addEventListener(
    "fullscreenchange",
    () => {

        /*
            ブラウザ側から
            fullscreenを解除した場合
        */

        if (
            !document.fullscreenElement
        ) {

            document.body.classList.remove(
                "production-mode"
            );

        }

    }
);


/* ==================================================
   KEYBOARD
================================================== */

document.addEventListener(
    "keydown",
    e => {

        if (
            e.key === "Escape"
        ) {

            if (
                document.body.classList.contains(
                    "timetable-open"
                )
            ) {

                closeTimetable();

            }
            else {

                exitProductionMode();

            }

        }


        /*
            PCではEnterで本番モード
        */

        if (
            e.key === "Enter"
        ) {

            enterProductionMode();

        }

    }
);


/* ==================================================
   ESCAPE HTML
================================================== */

function escapeHTML(text) {

    return String(text)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}


/* ==================================================
   INITIALIZE
================================================== */

let changed =
    false;


events.forEach(
    item => {

        if (!item.id) {

            item.id =
                crypto.randomUUID();

            changed =
                true;

        }

    }
);


if (changed) {

    saveEvents();

}


renderTimeline();

preciseClock();


/* ==================================================
   SWIPE TO OPEN / CLOSE
================================================== */

let touchStartX = 0;

let touchStartY = 0;


document.addEventListener(
    "touchstart",
    e => {

        if (
            e.touches.length !== 1
        ) {

            return;

        }


        touchStartX =
            e.touches[0].clientX;


        touchStartY =
            e.touches[0].clientY;

    },
    {
        passive: true
    }
);


document.addEventListener(
    "touchend",
    e => {

        if (
            e.changedTouches.length !== 1
        ) {

            return;

        }


        const x =
            e.changedTouches[0].clientX;


        const y =
            e.changedTouches[0].clientY;


        const dx =
            x - touchStartX;


        const dy =
            y - touchStartY;


        /*
            横方向のスワイプだけ
        */

        if (
            Math.abs(dx) <
            Math.abs(dy)
        ) {

            return;

        }


        /*
            右端から左へ
            タイムテーブルを開く
        */

        if (
            dx < -70 &&
            touchStartX >
            window.innerWidth - 100
        ) {

            const side =
                document.getElementById(
                    "side"
                );


            if (
                !side.classList.contains(
                    "open"
                )
            ) {

                toggleTimetable();

            }

        }


        /*
            タイムテーブルを
            右へスワイプして閉じる
        */

        if (
            dx > 70 &&
            document.body.classList.contains(
                "timetable-open"
            )
        ) {

            closeTimetable();

        }

    },
    {
        passive: true
    }
);

</script>

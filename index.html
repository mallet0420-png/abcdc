<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>STAGE CLOCK</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #050505;
    color: #fff;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;
}

button,
input {
    font: inherit;
}

/* =========================
   MAIN
========================= */

.main {
    width: 100%;
    height: 100dvh;

    display: grid;
    grid-template-columns: 58% 42%;

    align-items: center;

    padding: 5vh 6vw;
}

/* =========================
   CLOCK
========================= */

.clock-area {
    display: flex;
    flex-direction: column;
    justify-content: center;
}

.label {
    color: #666;
    font-size: clamp(9px, 1.2vw, 15px);
    letter-spacing: .45em;
    margin-bottom: 18px;
}

.clock {
    font-size: clamp(60px, 10vw, 160px);
    font-weight: 700;
    line-height: .95;
    font-variant-numeric: tabular-nums;
}

.date {
    margin-top: 18px;
    color: #666;
    font-size: clamp(11px, 1.4vw, 18px);
    letter-spacing: .25em;
}

/* =========================
   CURRENT
========================= */

.info-area {
    padding-left: 3vw;
}

.info-label {
    color: #666;
    font-size: clamp(9px, 1.1vw, 14px);
    letter-spacing: .4em;
}

.current-name {
    margin-top: 10px;
    font-size: clamp(28px, 4vw, 60px);
    font-weight: 700;
}

.current-time {
    margin-top: 6px;
    color: #777;
    font-size: clamp(13px, 1.5vw, 20px);
}

/* =========================
   NEXT
========================= */

.next-area {
    margin-top: 45px;
}

.next-name {
    margin-top: 10px;
    font-size: clamp(22px, 3vw, 45px);
    font-weight: 700;
}

.next-time {
    margin-top: 5px;
    color: #777;
    font-size: clamp(13px, 1.5vw, 20px);
}

.countdown {
    margin-top: 8px;
    font-size: clamp(30px, 4.5vw, 65px);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
}

/* =========================
   NEXT BUTTON
========================= */

.next-button {
    margin-top: 28px;

    width: 82px;
    height: 82px;

    border: 1px solid #444;
    border-radius: 50%;

    background: #151515;
    color: #fff;

    font-size: 40px;
    font-weight: 300;

    display: flex;
    align-items: center;
    justify-content: center;

    transition: transform .1s, background .1s;
}

.next-button:active {
    transform: scale(.9);
    background: #292929;
}

.next-button:disabled {
    opacity: .25;
}

/* =========================
   TAB
========================= */

.timetable-tab {
    position: fixed;

    right: 0;
    top: 50%;

    transform: translateY(-50%);

    width: 54px;
    height: 108px;

    background: #111;
    color: #fff;

    border: 1px solid #333;
    border-right: none;

    border-radius: 54px 0 0 54px;

    z-index: 3000;

    font-size: 30px;
}

/* =========================
   SIDE
========================= */

.side {
    position: fixed;

    top: 0;
    right: 0;

    width: min(470px, 92vw);
    height: 100dvh;

    background: #080808;

    border-left: 1px solid #222;

    z-index: 2500;

    padding: 18px;

    display: flex;
    flex-direction: column;

    transform: translateX(100%);

    transition: transform .25s ease;
}

.side.open {
    transform: translateX(0);
}

/* =========================
   HEADER
========================= */

.side-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.side-header h2 {
    margin: 0;
    font-size: 14px;
    letter-spacing: .35em;
}

.close-button {
    background: #111;
    color: #aaa;
    border: 1px solid #333;
    border-radius: 5px;
    padding: 7px 12px;
}

/* =========================
   TIMELINE
========================= */

.timeline {
    flex: 1;
    overflow-y: auto;
    margin-top: 15px;
    padding-bottom: 15px;
}

/* =========================
   EVENT
========================= */

.event {
    display: grid;
    grid-template-columns: 70px 1fr 28px;
    gap: 8px;

    padding: 12px 8px;

    margin-bottom: 5px;

    border-left: 3px solid #333;

    border-radius: 0 7px 7px 0;
}

.event.current {
    background: #181818;
    border-left-color: #fff;
}

.event.completed {
    opacity: .42;
}

.event-main {
    cursor: pointer;
}

.original-time {
    font-size: 14px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
}

.event-name {
    font-size: 15px;
    font-weight: 600;
}

.actual-time {
    margin-top: 4px;
    font-size: 11px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
}

.actual-time.push {
    color: #ff4141;
}

.actual-time.pull {
    color: #48c85d;
}

.shift {
    font-size: 10px;
    font-weight: 700;
}

.shift.push {
    color: #ff4141;
}

.shift.pull {
    color: #48c85d;
}

.on-time {
    margin-top: 4px;
    color: #777;
    font-size: 9px;
}

.now {
    margin-top: 5px;
    color: #888;
    font-size: 9px;
}

.delete-button {
    border: none;
    background: transparent;
    color: #555;
    font-size: 20px;
}

/* =========================
   ADD
========================= */

.add-area {
    border-top: 1px solid #222;
    padding-top: 12px;
}

.add-grid {
    display: grid;
    grid-template-columns: 90px 1fr;
    gap: 6px;
}

.add-grid input {
    width: 100%;
    background: #111;
    color: #fff;
    border: 1px solid #333;
    border-radius: 5px;
    padding: 9px;
}

.add-grid button {
    grid-column: 1 / 3;
    padding: 10px;
    background: #111;
    color: #fff;
    border: 1px solid #333;
    border-radius: 5px;
}

/* =========================
   EDIT MODAL
========================= */

.modal-bg {
    position: fixed;

    inset: 0;

    background: rgba(0,0,0,.7);

    z-index: 5000;

    display: none;

    align-items: center;
    justify-content: center;
}

.modal-bg.show {
    display: flex;
}

.modal {
    width: min(360px, 90vw);

    background: #111;

    border: 1px solid #333;

    border-radius: 10px;

    padding: 20px;
}

.modal h3 {
    margin: 0 0 18px;
    font-size: 16px;
}

.modal label {
    display: block;
    color: #777;
    font-size: 11px;
    margin-bottom: 5px;
}

.modal input {
    width: 100%;
    background: #050505;
    color: #fff;
    border: 1px solid #333;
    border-radius: 5px;
    padding: 11px;
    margin-bottom: 14px;
}

.modal-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 7px;
}

.modal-buttons button {
    padding: 11px;
    background: #181818;
    color: #fff;
    border: 1px solid #333;
    border-radius: 5px;
}

.modal-buttons .save {
    background: #fff;
    color: #000;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 700px) {

    .main {
        grid-template-columns: 1fr;
        text-align: center;
        padding: 25px;
    }

    .clock-area {
        align-items: center;
    }

    .info-area {
        padding-left: 0;
        margin-top: 25px;
    }

    .next-area {
        margin-top: 25px;
    }

    .next-button {
        margin-left: auto;
        margin-right: auto;
    }
}

/* =========================
   LANDSCAPE PHONE
========================= */

@media
(max-height: 500px)
and (orientation: landscape) {

    .main {
        grid-template-columns: 58% 42%;
        padding: 3vh 5vw;
    }

    .clock {
        font-size: min(12vw, 95px);
    }

    .current-name {
        font-size: min(5vw, 38px);
    }

    .next-name {
        font-size: min(4vw, 32px);
    }

    .next-area {
        margin-top: 15px;
    }

    .next-button {
        width: 62px;
        height: 62px;
        font-size: 30px;
        margin-top: 15px;
    }
}
</style>
</head>

<body>

<!-- =========================
     MAIN
========================= -->

<main class="main">

    <section class="clock-area">

        <div class="label">
            CURRENT TIME
        </div>

        <div id="clock" class="clock">
            00:00:00
        </div>

        <div id="date" class="date">
            ---- / -- / -- ---
        </div>

    </section>


    <section class="info-area">

        <div class="info-label">
            CURRENT
        </div>

        <div id="currentName" class="current-name">
            START
        </div>

        <div id="currentTime" class="current-time">
            --:--
        </div>


        <div class="next-area">

            <div class="info-label">
                NEXT
            </div>

            <div id="nextName" class="next-name">
                --
            </div>

            <div id="nextTime" class="next-time">
                --:--
            </div>

            <div id="countdown" class="countdown">
                --:--:--
            </div>

        </div>


        <button
            id="nextButton"
            class="next-button"
            onclick="nextCue()"
        >
            →
        </button>

    </section>

</main>


<!-- =========================
     TIMETABLE TAB
========================= -->

<button
    class="timetable-tab"
    onclick="toggleTimetable()"
>
    ‹
</button>


<!-- =========================
     TIMETABLE
========================= -->

<aside id="side" class="side">

    <div class="side-header">

        <h2>
            TIME TABLE
        </h2>

        <button
            class="close-button"
            onclick="toggleTimetable()"
        >
            閉じる
        </button>

    </div>


    <div id="timeline" class="timeline"></div>


    <!-- ADD EVENT -->

    <div class="add-area">

        <div class="add-grid">

            <input
                id="newTime"
                type="time"
            >

            <input
                id="newName"
                type="text"
                placeholder="アーティスト / 進行"
            >

            <button onclick="addEvent()">
                ＋ 進行を追加
            </button>

        </div>

    </div>

</aside>


<!-- =========================
     EDIT MODAL
========================= -->

<div
    id="modalBg"
    class="modal-bg"
>

    <div class="modal">

        <h3>
            進行を編集
        </h3>

        <label>
            本来の開始時間
        </label>

        <input
            id="editTime"
            type="time"
        >

        <label>
            アーティスト / 進行名
        </label>

        <input
            id="editName"
            type="text"
        >

        <div class="modal-buttons">

            <button
                onclick="closeEdit()"
            >
                キャンセル
            </button>

            <button
                class="save"
                onclick="saveEdit()"
            >
                保存
            </button>

        </div>

    </div>

</div>


<script>

/* =====================================================
   STORAGE
===================================================== */

const EVENT_STORAGE =
    "stage_clock_events_v5";

const STATE_STORAGE =
    "stage_clock_state_v5";


/* =====================================================
   DEFAULT
===================================================== */

const defaultEvents = [

    {
        id: createId(),
        time: "19:00",
        name: "ARTIST 1"
    },

    {
        id: createId(),
        time: "19:30",
        name: "転換"
    },

    {
        id: createId(),
        time: "19:40",
        name: "ARTIST 2"
    },

    {
        id: createId(),
        time: "20:10",
        name: "転換"
    },

    {
        id: createId(),
        time: "20:20",
        name: "ARTIST 3"
    },

    {
        id: createId(),
        time: "20:50",
        name: "END"
    }

];


let events =
    JSON.parse(
        localStorage.getItem(
            EVENT_STORAGE
        )
    ) || defaultEvents;


let state =
    JSON.parse(
        localStorage.getItem(
            STATE_STORAGE
        )
    ) || {

        currentIndex: -1,

        /*
         * 各進行を実際に
         * 何時に開始したか
         */
        actualTimes: {}

    };


let editingIndex = -1;


/* =====================================================
   ID
===================================================== */

function createId() {

    return Date.now().toString(36)
        +
        Math.random()
            .toString(36)
            .substring(2, 8);
}


/* =====================================================
   SAVE
===================================================== */

function save() {

    localStorage.setItem(
        EVENT_STORAGE,
        JSON.stringify(events)
    );

    localStorage.setItem(
        STATE_STORAGE,
        JSON.stringify(state)
    );
}


/* =====================================================
   TIME
===================================================== */

function timeToSeconds(time) {

    const parts =
        time.split(":");

    return (
        Number(parts[0]) * 3600
        +
        Number(parts[1]) * 60
    );
}


function secondsToTime(seconds) {

    seconds =
        ((seconds % 86400) + 86400)
        % 86400;

    const h =
        Math.floor(
            seconds / 3600
        );

    const m =
        Math.floor(
            (seconds % 3600) / 60
        );

    const s =
        seconds % 60;

    return (
        String(h).padStart(2, "0")
        +
        ":"
        +
        String(m).padStart(2, "0")
        +
        ":"
        +
        String(s).padStart(2, "0")
    );
}


function getNowSeconds() {

    const now = new Date();

    return (
        now.getHours() * 3600
        +
        now.getMinutes() * 60
        +
        now.getSeconds()
    );
}


/* =====================================================
   DIFFERENCE
===================================================== */

function getDifference(
    planned,
    actual
) {

    let diff =
        actual - planned;

    /*
     * 日付またぎ対策
     */
    if (diff > 43200) {
        diff -= 86400;
    }

    if (diff < -43200) {
        diff += 86400;
    }

    return diff;
}


/* =====================================================
   NEXT INDEX
===================================================== */

function getNextIndex() {

    const index =
        state.currentIndex + 1;

    if (
        index >= events.length
    ) {
        return -1;
    }

    return index;
}


/* =====================================================
   ACTUAL TIME
===================================================== */

/*
 * まだ実際の開始時刻が
 * 記録されていない場合は、
 *
 * 「直前の進行の実時刻」
 * を基準にして、
 * 元タイテの時間差を加える。
 *
 * これによって
 *
 * +5min
 *
 * が後続の進行にも
 * 自動的に引き継がれる。
 */

function getPredictedTime(index) {

    if (
        index < 0 ||
        index >= events.length
    ) {
        return null;
    }


    /*
     * 実際の開始時刻が
     * すでに記録されている場合
     */

    if (
        state.actualTimes[
            events[index].id
        ] !== undefined
    ) {

        return state.actualTimes[
            events[index].id
        ];
    }


    /*
     * 最初の進行
     */

    let knownIndex = -1;


    for (
        let i = index - 1;
        i >= 0;
        i--
    ) {

        if (
            state.actualTimes[
                events[i].id
            ] !== undefined
        ) {

            knownIndex = i;

            break;
        }
    }


    /*
     * 実績がまだない場合
     */

    if (
        knownIndex === -1
    ) {

        return timeToSeconds(
            events[index].time
        );
    }


    /*
     * 直前の実績から
     * 元タイテ上の経過時間を足す
     */

    let result =
        state.actualTimes[
            events[knownIndex].id
        ];


    for (
        let i = knownIndex + 1;
        i <= index;
        i++
    ) {

        const previous =
            timeToSeconds(
                events[i - 1].time
            );

        const current =
            timeToSeconds(
                events[i].time
            );

        let interval =
            current - previous;

        if (interval < 0) {
            interval += 86400;
        }

        result += interval;
    }


    return result % 86400;
}


/* =====================================================
   CURRENT SHIFT
===================================================== */

function getShift(index) {

    if (
        index < 0 ||
        index >= events.length
    ) {
        return 0;
    }


    const planned =
        timeToSeconds(
            events[index].time
        );


    const actual =
        getPredictedTime(index);


    return getDifference(
        planned,
        actual
    );
}


/* =====================================================
   NEXT CUE
===================================================== */

function nextCue() {

    const index =
        getNextIndex();


    if (
        index === -1
    ) {
        return;
    }


    /*
     * →を押した瞬間の
     * 現在時刻
     */

    const actual =
        getNowSeconds();


    /*
     * この進行の
     * 本来の時間
     */

    const planned =
        timeToSeconds(
            events[index].time
        );


    /*
     * 実際の開始時刻を保存
     */

    state.actualTimes[
        events[index].id
    ] = actual;


    /*
     * 現在進行を更新
     */

    state.currentIndex =
        index;


    save();

    renderTimeline();

    updateMain();
}


/* =====================================================
   CLOCK
===================================================== */

function updateClock() {

    const now =
        new Date();


    const h =
        String(
            now.getHours()
        ).padStart(2, "0");

    const m =
        String(
            now.getMinutes()
        ).padStart(2, "0");

    const s =
        String(
            now.getSeconds()
        ).padStart(2, "0");


    document.getElementById(
        "clock"
    ).textContent =
        `${h}:${m}:${s}`;


    const days = [
        "SUN",
        "MON",
        "TUE",
        "WED",
        "THU",
        "FRI",
        "SAT"
    ];


    document.getElementById(
        "date"
    ).textContent =

        `${now.getFullYear()} / `

        +

        `${String(
            now.getMonth() + 1
        ).padStart(2, "0")} / `

        +

        `${String(
            now.getDate()
        ).padStart(2, "0")} `

        +

        days[
            now.getDay()
        ];


    updateMain();
}


/* =====================================================
   MAIN
===================================================== */

function updateMain() {

    /*
     * CURRENT
     */

    const current =
        state.currentIndex;


    if (
        current >= 0 &&
        current < events.length
    ) {

        const event =
            events[current];


        document.getElementById(
            "currentName"
        ).textContent =
            event.name;


        document.getElementById(
            "currentTime"
        ).textContent =
            secondsToTime(
                state.actualTimes[
                    event.id
                ]
            );

    } else {

        document.getElementById(
            "currentName"
        ).textContent =
            "START";


        document.getElementById(
            "currentTime"
        ).textContent =
            "--:--";
    }


    /*
     * NEXT
     */

    const next =
        getNextIndex();


    if (
        next === -1
    ) {

        document.getElementById(
            "nextName"
        ).textContent =
            "END";


        document.getElementById(
            "nextTime"
        ).textContent =
            "--:--";


        document.getElementById(
            "countdown"
        ).textContent =
            "--:--:--";


        document.getElementById(
            "nextButton"
        ).disabled =
            true;


        return;
    }


    const nextEvent =
        events[next];


    document.getElementById(
        "nextName"
    ).textContent =
        nextEvent.name;


    /*
     * 予測される次の時間
     */

    const predicted =
        getPredictedTime(next);


    document.getElementById(
        "nextTime"
    ).textContent =
        secondsToTime(
            predicted
        );


    /*
     * 現在時刻との差
     */

    let diff =
        predicted -
        getNowSeconds();


    /*
     * 日付またぎ
     */

    if (diff > 43200) {
        diff -= 86400;
    }

    if (diff < -43200) {
        diff += 86400;
    }


    const countdown =
        document.getElementById(
            "countdown"
        );


    /*
     * 未来
     */

    if (
        diff >= 0
    ) {

        countdown.textContent =
            formatDuration(diff);

        countdown.style.color =
            "#fff";

    }

    /*
     * 押している
     */

    else {

        countdown.textContent =
            "+" +
            formatDuration(
                Math.abs(diff)
            );

        countdown.style.color =
            "#ff4141";
    }


    document.getElementById(
        "nextButton"
    ).disabled =
        false;
}


/* =====================================================
   DURATION
===================================================== */

function formatDuration(seconds) {

    seconds =
        Math.floor(
            Math.abs(seconds)
        );


    const h =
        Math.floor(
            seconds / 3600
        );

    const m =
        Math.floor(
            (seconds % 3600) / 60
        );

    const s =
        seconds % 60;


    return (
        String(h).padStart(2, "0")
        +
        ":"
        +
        String(m).padStart(2, "0")
        +
        ":"
        +
        String(s).padStart(2, "0")
    );
}


/* =====================================================
   TIMETABLE
===================================================== */

function renderTimeline() {

    const timeline =
        document.getElementById(
            "timeline"
        );


    timeline.innerHTML = "";


    events.forEach(
        (event, index) => {

            const element =
                document.createElement(
                    "div"
                );


            element.className =
                "event";


            if (
                index ===
                state.currentIndex
            ) {

                element.classList.add(
                    "current"
                );
            }


            if (
                index <
                state.currentIndex
            ) {

                element.classList.add(
                    "completed"
                );
            }


            const shift =
                getShift(index);


            let actualHTML = "";


            /*
             * まだ始まっていない
             * 進行は予測時間
             */

            const predicted =
                getPredictedTime(index);


            /*
             * 実績がある
             */

            const hasActual =
                state.actualTimes[
                    event.id
                ] !== undefined;


            if (
                hasActual
            ) {

                const actual =
                    state.actualTimes[
                        event.id
                    ];


                if (
                    shift > 0
                ) {

                    actualHTML = `

                        <div
                            class="actual-time push"
                        >
                            ${secondsToTime(actual)}
                        </div>

                        <div
                            class="shift push"
                        >
                            ＋${Math.abs(
                                Math.round(
                                    shift / 60
                                )
                            )}min
                        </div>

                    `;

                }

                else if (
                    shift < 0
                ) {

                    actualHTML = `

                        <div
                            class="actual-time pull"
                        >
                            ${secondsToTime(actual)}
                        </div>

                        <div
                            class="shift pull"
                        >
                            −${Math.abs(
                                Math.round(
                                    shift / 60
                                )
                            )}min
                        </div>

                    `;

                }

                else {

                    actualHTML = `

                        <div class="on-time">
                            ON TIME
                        </div>

                    `;
                }

            }

            /*
             * 未来の予測時間
             */

            else if (
                shift !== 0
            ) {

                const predictedShift =
                    shift;


                if (
                    predictedShift > 0
                ) {

                    actualHTML = `

                        <div
                            class="actual-time push"
                        >
                            ${secondsToTime(predicted)}
                        </div>

                        <div
                            class="shift push"
                        >
                            ＋${Math.abs(
                                Math.round(
                                    predictedShift / 60
                                )
                            )}min
                        </div>

                    `;

                }

                else {

                    actualHTML = `

                        <div
                            class="actual-time pull"
                        >
                            ${secondsToTime(predicted)}
                        </div>

                        <div
                            class="shift pull"
                        >
                            −${Math.abs(
                                Math.round(
                                    predictedShift / 60
                                )
                            )}min
                        </div>

                    `;
                }
            }


            let nowHTML = "";


            if (
                index ===
                state.currentIndex
            ) {

                nowHTML = `

                    <div class="now">
                        ● NOW
                    </div>

                `;
            }


            element.innerHTML = `

                <div class="original-time">
                    ${event.time}
                </div>


                <div
                    class="event-main"
                    onclick="
                        openEdit(${index})
                    "
                >

                    <div class="event-name">
                        ${escapeHTML(event.name)}
                    </div>

                    ${actualHTML}

                    ${nowHTML}

                </div>


                <button
                    class="delete-button"
                    onclick="
                        deleteEvent(${index})
                    "
                >
                    ×
                </button>

            `;


            timeline.appendChild(
                element
            );

        }
    );
}


/* =====================================================
   ADD
===================================================== */

function addEvent() {

    const time =
        document.getElementById(
            "newTime"
        ).value;


    const name =
        document.getElementById(
            "newName"
        ).value.trim();


    if (
        !time ||
        !name
    ) {

        alert(
            "時間と名前を入力してください。"
        );

        return;
    }


    events.push({

        id: createId(),

        time,

        name

    });


    sortEvents();

    save();

    renderTimeline();

    updateMain();


    document.getElementById(
        "newTime"
    ).value = "";


    document.getElementById(
        "newName"
    ).value = "";
}


/* =====================================================
   SORT
===================================================== */

function sortEvents() {

    events.sort(
        (a, b) =>

            timeToSeconds(a.time)
            -
            timeToSeconds(b.time)
    );
}


/* =====================================================
   EDIT
===================================================== */

function openEdit(index) {

    editingIndex =
        index;


    const event =
        events[index];


    document.getElementById(
        "editTime"
    ).value =
        event.time;


    document.getElementById(
        "editName"
    ).value =
        event.name;


    document.getElementById(
        "modalBg"
    ).classList.add(
        "show"
    );
}


function closeEdit() {

    editingIndex =
        -1;


    document.getElementById(
        "modalBg"
    ).classList.remove(
        "show"
    );
}


function saveEdit() {

    if (
        editingIndex < 0
    ) {
        return;
    }


    const time =
        document.getElementById(
            "editTime"
        ).value;


    const name =
        document.getElementById(
            "editName"
        ).value.trim();


    if (
        !time ||
        !name
    ) {

        alert(
            "時間と名前を入力してください。"
        );

        return;
    }


    const oldId =
        events[
            editingIndex
        ].id;


    events[
        editingIndex
    ].time =
        time;


    events[
        editingIndex
    ].name =
        name;


    /*
     * タイテ変更時、
     * その進行の実績は
     * 一旦リセット。
     *
     * 本番前の時間変更を
     * 安全に扱うため。
     */

    delete state.actualTimes[
        oldId
    ];


    sortEvents();

    save();

    renderTimeline();

    updateMain();

    closeEdit();
}


/* =====================================================
   DELETE
===================================================== */

function deleteEvent(index) {

    if (
        !confirm(
            "この進行を削除しますか？"
        )
    ) {
        return;
    }


    const id =
        events[index].id;


    events.splice(
        index,
        1
    );


    delete state.actualTimes[id];


    if (
        index <=
        state.currentIndex
    ) {

        state.currentIndex--;
    }


    save();

    renderTimeline();

    updateMain();
}


/* =====================================================
   RESET
===================================================== */

function resetAll() {

    if (
        !confirm(
            "タイムテーブルと進行履歴をすべてリセットしますか？"
        )
    ) {
        return;
    }


    localStorage.removeItem(
        EVENT_STORAGE
    );

    localStorage.removeItem(
        STATE_STORAGE
    );


    location.reload();
}


/* =====================================================
   TIMETABLE OPEN
===================================================== */

function toggleTimetable() {

    document
        .getElementById("side")
        .classList.toggle("open");
}


/* =====================================================
   ESCAPE
===================================================== */

function escapeHTML(text) {

    return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


/* =====================================================
   SECOND BOUNDARY
===================================================== */

function startClock() {

    updateClock();


    const now =
        new Date();


    const delay =
        1000 -
        now.getMilliseconds();


    setTimeout(
        startClock,
        delay
    );
}


/* =====================================================
   INIT
===================================================== */

sortEvents();

save();

renderTimeline();

startClock();

</script>

<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>STAGE CLOCK</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  background:#050505;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
}

body{
  overflow:hidden;
}

button,input{
  font:inherit;
}

button{
  cursor:pointer;
}

/* =================================
   MAIN APP
================================= */

.app{
  position:fixed;
  inset:0;
  padding:clamp(22px,5vh,60px) clamp(22px,6vw,90px);
  display:flex;
  flex-direction:column;

  /*
    TIME TABLEが開いたとき、
    右側にスペースを作る
  */
  transition:
    width .25s ease,
    padding-right .25s ease;
}

.app.timetable-open{
  width:calc(100% - min(490px,94vw));
  padding-right:clamp(22px,4vw,60px);
}


/* =================================
   DATE
================================= */

.date{
  color:#555;
  font-size:10px;
  font-weight:600;
  letter-spacing:.2em;
  margin-bottom:12px;
  font-variant-numeric:tabular-nums;
}


/* =================================
   CLOCK
================================= */

.clock-label{
  color:#555;
  font-size:10px;
  letter-spacing:.42em;
  margin-bottom:14px;
}

.clock{
  font-size:clamp(60px,12vw,150px);
  font-weight:700;
  line-height:.9;
  letter-spacing:-.055em;
  font-variant-numeric:tabular-nums;
}


/* =================================
   MAIN
================================= */

.main{
  flex:1;

  display:grid;
  grid-template-columns:minmax(0,1fr) auto;

  gap:30px;

  align-items:end;

  padding-bottom:4vh;

  min-width:0;
}

.main > div:first-child{
  min-width:0;
}

.label{
  color:#555;
  font-size:9px;
  letter-spacing:.42em;
}


/* =================================
   NOW
================================= */

.now-name{
  margin-top:9px;

  font-size:clamp(30px,4vw,62px);
  font-weight:700;

  line-height:1;

  max-width:100%;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.time-range{
  margin-top:11px;

  color:#777;

  font-size:clamp(13px,1.5vw,20px);

  font-variant-numeric:tabular-nums;
}


/* =================================
   REMAINING
================================= */

.remaining{
  margin-top:22px;
}

.remaining-value{
  margin-top:5px;

  font-size:clamp(25px,3vw,42px);

  font-weight:700;

  font-variant-numeric:tabular-nums;

  letter-spacing:-.03em;
}


/* =================================
   TOTAL
================================= */

.total{
  margin-top:20px;

  display:flex;
  align-items:baseline;

  gap:14px;
}

.total-value{
  font-size:clamp(25px,3vw,42px);

  font-weight:700;

  font-variant-numeric:tabular-nums;
}

.ontime{
  color:#666;
}

.push{
  color:#ff3b3b;
}

.pull{
  color:#40c95a;
}


/* =================================
   NEXT
================================= */

.next-area{
  display:flex;

  align-items:center;

  gap:18px;

  min-width:0;

  /*
    タイムテーブルOPEN時にも
    このエリアはメイン内に残る
  */
  flex-shrink:0;
}

.next-info{
  min-width:0;
  max-width:220px;
}

.next-name{
  margin-top:7px;

  font-size:clamp(18px,2vw,28px);

  font-weight:600;

  max-width:100%;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;
}

.next-time{
  margin-top:5px;

  color:#666;

  font-size:13px;

  font-variant-numeric:tabular-nums;
}


/* =================================
   NEXT BUTTON
================================= */

.next-button{
  width:clamp(70px,8vw,100px);
  height:clamp(70px,8vw,100px);

  flex-shrink:0;

  border-radius:50%;

  border:1px solid #333;

  background:#111;

  color:#fff;

  font-size:clamp(32px,4vw,48px);

  font-weight:300;

  display:flex;

  align-items:center;
  justify-content:center;

  transition:
    transform .12s ease,
    background .12s ease;
}

.next-button:active{
  transform:scale(.91);
  background:#222;
}

.next-button:disabled{
  opacity:.15;
}


/* =================================
   TIME TABLE TAB
================================= */

.timetable-tab{
  position:fixed;

  z-index:4000;

  right:0;
  top:50%;

  transform:translateY(-50%);

  width:52px;
  height:112px;

  border:1px solid #333;

  border-right:none;

  border-radius:56px 0 0 56px;

  background:#111;

  color:#aaa;

  font-size:31px;

  transition:
    right .25s ease;
}


/*
  OPEN時はTABも
  TIME TABLEの左端へ移動
*/

.timetable-tab.open{
  right:min(490px,94vw);
}


/* =================================
   SIDE / TIME TABLE
================================= */

.side{
  position:fixed;

  z-index:3500;

  top:0;
  right:0;

  width:min(490px,94vw);

  height:100dvh;

  background:#090909;

  border-left:1px solid #222;

  padding:20px;

  display:flex;

  flex-direction:column;

  transform:translateX(100%);

  transition:
    transform .25s ease;
}

.side.open{
  transform:translateX(0);
}


/* =================================
   SIDE HEADER
================================= */

.side-header{
  display:flex;

  justify-content:space-between;

  align-items:center;
}

.side-title{
  color:#aaa;

  font-size:12px;

  letter-spacing:.4em;
}

.close-button{
  padding:7px 12px;

  border:1px solid #333;

  border-radius:6px;

  background:#111;

  color:#777;
}


/* =================================
   TIMELINE
================================= */

.timeline{
  flex:1;

  overflow-y:auto;

  margin-top:15px;

  padding-bottom:15px;
}

.event{
  position:relative;

  display:grid;

  grid-template-columns:75px 1fr;

  gap:12px;

  padding:15px 9px;

  border-left:3px solid transparent;

  border-radius:6px;
}

.event.current{
  background:#181818;

  border-left-color:#fff;
}

.event.completed{
  opacity:.38;
}

.event-time{
  color:#aaa;

  font-size:14px;

  font-weight:600;

  line-height:1.4;

  font-variant-numeric:tabular-nums;

  cursor:pointer;
}

.event-time:hover{
  color:#fff;
}

.event-end{
  color:#444;

  font-size:11px;

  cursor:default;
}

.event-body{
  min-width:0;

  padding-right:24px;
}

.event-name{
  font-size:15px;

  font-weight:600;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;
}

.event-name.empty{
  color:#444;

  font-weight:400;
}

.shift{
  margin-top:4px;

  font-size:10px;

  font-weight:700;

  font-variant-numeric:tabular-nums;
}

.delete{
  position:absolute;

  top:7px;

  right:3px;

  border:0;

  background:none;

  color:#444;

  font-size:17px;
}


/* =================================
   ADD
================================= */

.add-area{
  flex-shrink:0;

  border-top:1px solid #222;

  padding-top:14px;
}

.input{
  width:100%;

  padding:11px;

  margin-bottom:7px;

  border:1px solid #333;

  border-radius:5px;

  outline:none;

  background:#111;

  color:#fff;
}

.input::placeholder{
  color:#555;
}

.add-button{
  width:100%;

  padding:12px;

  border:1px solid #333;

  border-radius:5px;

  background:#fff;

  color:#000;

  font-weight:600;
}

.bottom-actions{
  margin-top:7px;
}

.clear-button{
  width:100%;

  padding:10px;

  border:1px solid #333;

  border-radius:5px;

  background:#111;

  color:#666;
}


/* =================================
   MODAL
================================= */

.modal-bg{
  position:fixed;

  inset:0;

  z-index:6000;

  display:none;

  align-items:center;

  justify-content:center;

  background:rgba(0,0,0,.8);
}

.modal-bg.show{
  display:flex;
}

.modal{
  width:min(390px,90vw);

  padding:20px;

  border:1px solid #333;

  border-radius:10px;

  background:#111;
}

.modal-title{
  margin-bottom:18px;

  font-size:15px;

  letter-spacing:.04em;
}

.modal-label{
  display:block;

  margin-bottom:5px;

  color:#666;

  font-size:10px;

  letter-spacing:.12em;
}

.modal-input{
  width:100%;

  padding:10px;

  margin-bottom:15px;

  border:1px solid #333;

  border-radius:5px;

  outline:none;

  background:#050505;

  color:#fff;
}

.shift-control{
  display:grid;

  grid-template-columns:55px 1fr 55px;

  gap:8px;

  align-items:center;

  margin-bottom:18px;
}

.shift-button{
  height:44px;

  border:1px solid #333;

  border-radius:6px;

  background:#181818;

  color:#fff;

  font-size:22px;
}

.shift-display{
  height:44px;

  display:flex;

  justify-content:center;

  align-items:center;

  border:1px solid #333;

  border-radius:6px;

  background:#050505;

  font-weight:700;

  font-variant-numeric:tabular-nums;
}

.modal-buttons{
  display:grid;

  grid-template-columns:1fr 1fr;

  gap:7px;
}

.modal-buttons button{
  padding:11px;

  border:1px solid #333;

  border-radius:5px;

  background:#181818;

  color:#fff;
}

.modal-buttons .save{
  background:#fff;

  color:#000;
}

.modal-buttons .danger{
  background:#ff3b3b;

  color:#fff;
}


/* =================================
   MOBILE
================================= */

@media(max-width:700px){

  .app{
    padding:26px 22px;
  }

  .app.timetable-open{
    width:calc(100% - min(82vw,420px));

    padding-left:14px;
    padding-right:14px;
  }

  .clock{
    font-size:clamp(50px,16vw,90px);
  }

  .main{
    display:flex;

    flex-direction:column;

    align-items:stretch;

    justify-content:flex-end;

    gap:20px;

    padding-bottom:3vh;
  }

  .now-name{
    font-size:30px;
  }

  .remaining{
    margin-top:15px;
  }

  .total{
    margin-top:14px;
  }

  .next-area{
    justify-content:flex-end;
  }

  .next-info{
    max-width:45vw;
  }

  .next-button{
    width:65px;
    height:65px;
    font-size:30px;
  }

  .timetable-tab.open{
    right:min(82vw,420px);
  }

}


/* =================================
   SMALL MOBILE OPEN
================================= */

@media(max-width:480px){

  .app.timetable-open{
    width:calc(100% - 78vw);

    padding-left:10px;
    padding-right:8px;
  }

  .app.timetable-open .clock{
    font-size:clamp(32px,9vw,55px);
  }

  .app.timetable-open .clock-label{
    font-size:7px;
  }

  .app.timetable-open .date{
    font-size:7px;
  }

  .app.timetable-open .now-name{
    font-size:20px;
  }

  .app.timetable-open .remaining-value{
    font-size:19px;
  }

  .app.timetable-open .total-value{
    font-size:18px;
  }

  .app.timetable-open .next-name{
    font-size:14px;
  }

  .app.timetable-open .next-time{
    font-size:10px;
  }

  .app.timetable-open .next-button{
    width:48px;
    height:48px;
    font-size:22px;
  }

}


/* =================================
   LANDSCAPE
================================= */

@media(max-height:520px) and (orientation:landscape){

  .app{
    padding:4vh 6vw;
  }

  .app.timetable-open{
    width:calc(100% - min(490px,65vw));
  }

  .clock{
    font-size:min(13vw,105px);
  }

  .main{
    padding-bottom:0;
  }

  .now-name{
    font-size:min(5vw,38px);
  }

  .remaining{
    margin-top:8px;
  }

  .total{
    margin-top:8px;
  }

  .next-button{
    width:62px;
    height:62px;
    font-size:28px;
  }

}
</style>
</head>

<body>

<!-- =================================
     MAIN
================================= -->

<div
  id="app"
  class="app"
>

  <div
    id="date"
    class="date"
  >
    2026/08/18 TUE
  </div>

  <div class="clock-label">
    CURRENT TIME
  </div>

  <div
    id="clock"
    class="clock"
  >
    00:00:00
  </div>


  <div class="main">

    <div>

      <div class="label">
        NOW
      </div>

      <div
        id="nowName"
        class="now-name"
      >
        START
      </div>

      <div class="time-range">

        <span id="nowStart">
          --:--
        </span>

        →

        <span id="nowEnd">
          --:--
        </span>

      </div>


      <div class="remaining">

        <div class="label">
          REMAINING
        </div>

        <div
          id="remaining"
          class="remaining-value"
        >
          --:--:--
        </div>

      </div>


      <div class="total">

        <div class="label">
          TOTAL
        </div>

        <div
          id="total"
          class="total-value ontime"
        >
          ON TIME
        </div>

      </div>

    </div>


    <!-- NEXT -->

    <div class="next-area">

      <div class="next-info">

        <div class="label">
          NEXT
        </div>

        <div
          id="nextName"
          class="next-name"
        >
          --
        </div>

        <div
          id="nextTime"
          class="next-time"
        >
          --:--
        </div>

      </div>


      <button
        id="nextButton"
        class="next-button"
        onclick="nextEvent()"
      >
        →
      </button>

    </div>

  </div>

</div>


<!-- =================================
     TAB
================================= -->

<button
  id="tab"
  class="timetable-tab"
  onclick="toggleSide()"
>
  ‹
</button>


<!-- =================================
     TIME TABLE
================================= -->

<aside
  id="side"
  class="side"
>

  <div class="side-header">

    <div class="side-title">
      TIME TABLE
    </div>

    <button
      class="close-button"
      onclick="toggleSide()"
    >
      CLOSE
    </button>

  </div>


  <div
    id="timeline"
    class="timeline"
  ></div>


  <div class="add-area">

    <input
      id="newStart"
      class="input"
      type="time"
    >

    <input
      id="newName"
      class="input"
      type="text"
      placeholder="NAME"
    >

    <button
      class="add-button"
      onclick="addEvent()"
    >
      + ADD
    </button>

  </div>


  <div class="bottom-actions">

    <button
      class="clear-button"
      onclick="openClearModal()"
    >
      CLEAR
    </button>

  </div>

</aside>


<!-- =================================
     EDIT MODAL
================================= -->

<div
  id="modalBg"
  class="modal-bg"
>

  <div class="modal">

    <div class="modal-title">
      EDIT EVENT
    </div>


    <label class="modal-label">
      START TIME
    </label>

    <input
      id="editStart"
      class="modal-input"
      type="time"
    >


    <label class="modal-label">
      NAME
    </label>

    <input
      id="editName"
      class="modal-input"
      type="text"
    >


    <label class="modal-label">
      SHIFT
    </label>

    <div class="shift-control">

      <button
        class="shift-button"
        onclick="changeShift(-60)"
      >
        −
      </button>

      <div
        id="shiftDisplay"
        class="shift-display"
      >
        ON TIME
      </div>

      <button
        class="shift-button"
        onclick="changeShift(60)"
      >
        ＋
      </button>

    </div>


    <div class="modal-buttons">

      <button
        onclick="closeModal()"
      >
        CANCEL
      </button>

      <button
        class="save"
        onclick="saveEdit()"
      >
        SAVE
      </button>

    </div>

  </div>

</div>


<!-- =================================
     CLEAR MODAL
================================= -->

<div
  id="clearModal"
  class="modal-bg"
>

  <div class="modal">

    <div class="modal-title">
      CLEAR TIME TABLE?
    </div>

    <div style="
      color:#666;
      font-size:12px;
      line-height:1.7;
      margin-bottom:20px;
    ">
      This will delete all events<br>
      and shift data.
    </div>

    <div class="modal-buttons">

      <button
        onclick="closeClearModal()"
      >
        CANCEL
      </button>

      <button
        class="danger"
        onclick="clearAll()"
      >
        CLEAR
      </button>

    </div>

  </div>

</div>


<script>

/* =================================
   STORAGE
================================= */

const EVENT_KEY =
  "stage_clock_events_v9";

const STATE_KEY =
  "stage_clock_state_v9";

const ON_TIME = 60;


/* =================================
   DEFAULT
================================= */

const defaultEvents = [

  {
    id:id(),
    start:"19:00",
    name:"ARTIST 1"
  },

  {
    id:id(),
    start:"19:30",
    name:"SC"
  },

  {
    id:id(),
    start:"19:40",
    name:"ARTIST 2"
  },

  {
    id:id(),
    start:"20:10",
    name:"MC"
  },

  {
    id:id(),
    start:"20:20",
    name:"ARTIST 3"
  }

];


let events =
  JSON.parse(
    localStorage.getItem(EVENT_KEY)
  ) || defaultEvents;


let state =
  JSON.parse(
    localStorage.getItem(STATE_KEY)
  ) || {
    currentIndex:-1,
    shifts:{}
  };


let editingIndex=-1;
let editingShift=0;


/* =================================
   ID
================================= */

function id(){

  return Date.now().toString(36)
    +
    Math.random()
      .toString(36)
      .slice(2);

}


/* =================================
   SAVE
================================= */

function save(){

  localStorage.setItem(
    EVENT_KEY,
    JSON.stringify(events)
  );

  localStorage.setItem(
    STATE_KEY,
    JSON.stringify(state)
  );

}


/* =================================
   TIME
================================= */

function seconds(time){

  const p =
    time.split(":").map(Number);

  return p[0]*3600
    + p[1]*60;

}


function nowSeconds(){

  const d=new Date();

  return d.getHours()*3600
    +
    d.getMinutes()*60
    +
    d.getSeconds();

}


function timeString(sec){

  sec =
    ((sec%86400)+86400)%86400;

  const h =
    Math.floor(sec/3600);

  const m =
    Math.floor((sec%3600)/60);

  return String(h).padStart(2,"0")
    +
    ":"
    +
    String(m).padStart(2,"0");

}


function durationString(sec){

  if(sec<0){
    sec=0;
  }

  const h =
    Math.floor(sec/3600);

  const m =
    Math.floor((sec%3600)/60);

  const s =
    sec%60;

  return String(h).padStart(2,"0")
    +
    ":"
    +
    String(m).padStart(2,"0")
    +
    ":"
    +
    String(s).padStart(2,"0");

}


/* =================================
   DATE
================================= */

function updateDate(){

  const d=new Date();

  const y=
    d.getFullYear();

  const mo=
    String(d.getMonth()+1)
      .padStart(2,"0");

  const da=
    String(d.getDate())
      .padStart(2,"0");

  const days=[
    "SUN",
    "MON",
    "TUE",
    "WED",
    "THU",
    "FRI",
    "SAT"
  ];

  document.getElementById("date")
    .textContent=
    `${y}/${mo}/${da} ${days[d.getDay()]}`;

}


/* =================================
   SHIFT
================================= */

function shiftText(sec){

  if(Math.abs(sec)<=ON_TIME){

    return "ON TIME";

  }

  const sign=
    sec>0 ? "+" : "−";

  const a=
    Math.abs(sec);

  const m=
    Math.floor(a/60);

  const s=
    a%60;

  return sign
    +
    String(m).padStart(2,"0")
    +
    ":"
    +
    String(s).padStart(2,"0");

}


function shiftClass(sec){

  if(Math.abs(sec)<=ON_TIME){

    return "ontime";

  }

  return sec>0
    ? "push"
    : "pull";

}


/* =================================
   SORT
================================= */

function sortEvents(){

  events.sort(
    (a,b)=>
      seconds(a.start)
      -
      seconds(b.start)
  );

}


/* =================================
   CUMULATIVE SHIFT
================================= */

function totalShift(index){

  let total=0;

  for(
    let i=0;
    i<=index;
    i++
  ){

    total +=
      Number(
        state.shifts[
          events[i].id
        ] || 0
      );

  }

  return total;

}


/* =================================
   ACTUAL START
================================= */

function actualStart(index){

  return seconds(
    events[index].start
  )
  +
  totalShift(index);

}


/* =================================
   NEXT
================================= */

function nextEvent(){

  const next=
    state.currentIndex+1;

  if(next>=events.length){

    return;

  }


  const actual=
    nowSeconds();

  const planned=
    seconds(
      events[next].start
    );

  let shift=
    actual-planned;


  if(shift>43200){

    shift-=86400;

  }

  if(shift<-43200){

    shift+=86400;

  }


  /*
    ±1分はON TIME
  */

  if(Math.abs(shift)<=ON_TIME){

    shift=0;

  }


  state.shifts[
    events[next].id
  ]=shift;


  state.currentIndex=
    next;


  save();

  render();

}


/* =================================
   CLOCK
================================= */

function updateClock(){

  const d=new Date();

  const h=
    String(d.getHours())
      .padStart(2,"0");

  const m=
    String(d.getMinutes())
      .padStart(2,"0");

  const s=
    String(d.getSeconds())
      .padStart(2,"0");


  document.getElementById("clock")
    .textContent=
    `${h}:${m}:${s}`;


  updateDate();

  updateMain();


  setTimeout(
    updateClock,
    1000-d.getMilliseconds()
  );

}


/* =================================
   MAIN
================================= */

function updateMain(){

  const i=
    state.currentIndex;


  if(i<0){

    document.getElementById("nowName")
      .textContent="START";

    document.getElementById("nowStart")
      .textContent="--:--";

    document.getElementById("nowEnd")
      .textContent="--:--";

    document.getElementById("remaining")
      .textContent="--:--:--";

  }

  else{

    const e=
      events[i];


    document.getElementById("nowName")
      .textContent=
      e.name || "—";


    const start=
      actualStart(i);


    document.getElementById("nowStart")
      .textContent=
      timeString(start);


    /*
      次のSTARTが現在項目のEND
    */

    if(i<events.length-1){

      const end=
        actualStart(i+1);


      document.getElementById("nowEnd")
        .textContent=
        timeString(end);


      let current=
        nowSeconds();


      let remaining=
        end-current;


      /*
        日付またぎ
      */

      if(remaining<0){

        remaining+=86400;

      }


      document.getElementById("remaining")
        .textContent=
        durationString(remaining);

    }

    else{

      document.getElementById("nowEnd")
        .textContent="--:--";

      document.getElementById("remaining")
        .textContent="--:--:--";

    }

  }


  /* TOTAL */

  const total=
    i>=0
      ? totalShift(i)
      : 0;


  const totalEl=
    document.getElementById("total");


  totalEl.textContent=
    shiftText(total);


  totalEl.className=
    "total-value "
    +
    shiftClass(total);


  /* NEXT */

  const next=
    i+1;


  if(next>=events.length){

    document.getElementById("nextName")
      .textContent="END";

    document.getElementById("nextTime")
      .textContent="--:--";

    document.getElementById("nextButton")
      .disabled=true;

  }

  else{

    document.getElementById("nextName")
      .textContent=
      events[next].name || "—";

    document.getElementById("nextTime")
      .textContent=
      events[next].start;

    document.getElementById("nextButton")
      .disabled=false;

  }

}


/* =================================
   TIMELINE
================================= */

function renderTimeline(){

  const box=
    document.getElementById(
      "timeline"
    );


  box.innerHTML="";


  events.forEach((e,i)=>{

    const div=
      document.createElement("div");


    div.className="event";


    if(i===state.currentIndex){

      div.classList.add("current");

    }


    if(i<state.currentIndex){

      div.classList.add("completed");

    }


    const end=
      i<events.length-1
        ? events[i+1].start
        : "--:--";


    const shift=
      Number(
        state.shifts[e.id] || 0
      );


    let shiftHTML="";


    if(Math.abs(shift)>ON_TIME){

      shiftHTML=`

        <div
          class="shift ${shiftClass(shift)}"
        >
          ${shiftText(shift)}
        </div>

      `;

    }


    div.innerHTML=`

      <div
        class="event-time"
        onclick="openTimeEdit(event,${i})"
      >

        <div>
          ${e.start}
        </div>

        <div class="event-end">
          ${end}
        </div>

      </div>


      <div class="event-body">

        <div class="event-name ${
          e.name ? "" : "empty"
        }">

          ${escapeHTML(
            e.name || "—"
          )}

        </div>

        ${shiftHTML}

      </div>


      <button
        class="delete"
        onclick="deleteEvent(event,${i})"
      >
        ×
      </button>

    `;


    box.appendChild(div);

  });

}


/* =================================
   ADD
================================= */

function addEvent(){

  const start=
    document.getElementById(
      "newStart"
    ).value;


  const name=
    document.getElementById(
      "newName"
    ).value.trim();


  if(!start){

    alert(
      "START TIME is required."
    );

    return;

  }


  events.push({

    id:id(),

    start:start,

    name:name

  });


  sortEvents();

  save();

  render();


  document.getElementById(
    "newStart"
  ).value="";


  document.getElementById(
    "newName"
  ).value="";

}


/* =================================
   TIME EDIT
================================= */

function openTimeEdit(ev,index){

  ev.stopPropagation();


  editingIndex=
    index;


  const e=
    events[index];


  document.getElementById(
    "editStart"
  ).value=
    e.start;


  document.getElementById(
    "editName"
  ).value=
    e.name;


  editingShift=
    Number(
      state.shifts[e.id] || 0
    );


  updateShiftDisplay();


  document.getElementById(
    "modalBg"
  ).classList.add("show");

}


function changeShift(amount){

  editingShift+=amount;

  updateShiftDisplay();

}


function updateShiftDisplay(){

  const el=
    document.getElementById(
      "shiftDisplay"
    );


  el.textContent=
    shiftText(editingShift);


  el.className=
    "shift-display "
    +
    shiftClass(editingShift);

}


function saveEdit(){

  if(editingIndex<0){

    return;

  }


  const e=
    events[editingIndex];


  const start=
    document.getElementById(
      "editStart"
    ).value;


  const name=
    document.getElementById(
      "editName"
    ).value;


  if(!start){

    alert(
      "START TIME is required."
    );

    return;

  }


  e.start=
    start;

  e.name=
    name;


  if(
    Math.abs(editingShift)
    <=
    ON_TIME
  ){

    editingShift=0;

  }


  state.shifts[e.id]=
    editingShift;


  sortEvents();

  save();

  closeModal();

  render();

}


function closeModal(){

  editingIndex=-1;


  document.getElementById(
    "modalBg"
  ).classList.remove("show");

}


/* =================================
   DELETE
================================= */

function deleteEvent(ev,index){

  ev.stopPropagation();


  if(
    !confirm(
      "DELETE this event?"
    )
  ){

    return;

  }


  const eventId=
    events[index].id;


  delete state.shifts[eventId];


  events.splice(
    index,
    1
  );


  if(
    index<=state.currentIndex
  ){

    state.currentIndex--;

  }


  save();

  render();

}


/* =================================
   CLEAR
================================= */

function openClearModal(){

  document.getElementById(
    "clearModal"
  ).classList.add("show");

}


function closeClearModal(){

  document.getElementById(
    "clearModal"
  ).classList.remove("show");

}


function clearAll(){

  events=[];


  state={
    currentIndex:-1,
    shifts:{}
  };


  save();

  closeClearModal();

  render();

}


/* =================================
   TIME TABLE OPEN / CLOSE
================================= */

function toggleSide(){

  const side=
    document.getElementById(
      "side"
    );


  const tab=
    document.getElementById(
      "tab"
    );


  const app=
    document.getElementById(
      "app"
    );


  const open=
    !side.classList.contains(
      "open"
    );


  side.classList.toggle(
    "open",
    open
  );


  tab.classList.toggle(
    "open",
    open
  );


  app.classList.toggle(
    "timetable-open",
    open
  );


  tab.textContent=
    open
      ? "›"
      : "‹";

}


/* =================================
   RENDER
================================= */

function render(){

  sortEvents();

  renderTimeline();

  updateMain();

}


/* =================================
   ESCAPE
================================= */

function escapeHTML(str){

  return String(str)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}


/* =================================
   START
================================= */

render();

updateClock();

</script>
